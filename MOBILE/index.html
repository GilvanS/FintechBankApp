<!doctype html>
<html class="dark" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Fintech - A nova era da sua vida financeira</title>
    <!-- OTIMIZADO PARA APK: Fontes carregadas via link para funcionar no APK Android -->
    <!-- No APK, fontes precisam estar no HTML para serem carregadas corretamente -->
    <!-- CRÍTICO: Preconnect deve vir ANTES dos links de fontes para melhor performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- CRÍTICO: Carregar Material Symbols PRIMEIRO para evitar texto aparecer -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
    <!-- Fontes do redesign (Volt Brutalist / Midnight) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Space+Grotesk:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* CRÍTICO PARA APK: Estilos inline para garantir que Material Symbols funcione */
      /* IMPORTANTE: Esconder texto até fonte carregar para evitar texto aparecer */
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24 !important;
        font-family: 'Material Symbols Outlined', 'Roboto', sans-serif !important;
        font-weight: normal !important;
        font-style: normal !important;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga' !important;
        -webkit-font-smoothing: antialiased;
        /* Esconder texto até fonte carregar */
        opacity: 0;
        transition: opacity 0.3s ease-in;
      }
      
      /* Mostrar ícones quando fonte carregar */
      @font-face {
        font-family: 'Material Symbols Outlined';
        font-display: block;
      }
      
      /* Quando fonte estiver carregada, mostrar ícones */
      body.fonts-loaded .material-symbols-outlined,
      .material-symbols-outlined[style*="font-family"] {
        opacity: 1;
      }
      
      /* Fallback: mostrar após 1 segundo mesmo se fonte não carregar */
      body .material-symbols-outlined {
        animation: fadeInIcon 0.3s ease-in 1s forwards;
      }
      
      @keyframes fadeInIcon {
        to { opacity: 1; }
      }
      
      /* Garantir que Tailwind está aplicando estilos */
      body {
        font-family: 'Sora', sans-serif;
      }
    </style>
  </head>
  <body class="bg-background-dark font-display">
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
