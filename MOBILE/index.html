<!doctype html>
<html class="dark" lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Fintech - A nova era da sua vida financeira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#22C55E", // Vibrant Green
              "background-light": "#F3F4F6", // Light Gray
              "background-dark": "#0B1120", // Dark Navy Blue
              "text-light": "#1F2937", // Dark Gray Text for Light Mode
              "text-dark": "#E5E7EB", // Light Gray Text for Dark Mode
              "subtle-light": "#6B7280", // Medium Gray for Light Mode
              "subtle-dark": "#9CA3AF", // Medium Gray for Dark Mode
              "surface-dark": "#161D2B", // A slightly lighter dark for surfaces
            },
            fontFamily: {
              display: ["Sora", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.5rem", // 8px
              lg: "0.75rem", // 12px
              xl: "1rem", // 16px
            },
          },
        },
      };
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body class="bg-background-dark font-display">
    <div id="root"></div>
    <script type="module" src="src/index.tsx"></script>
  </body>
</html>
