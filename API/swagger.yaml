openapi: 3.0.0
info:
  title: FintechBankApp API
  description: API completa para o sistema bancário FintechBankApp
  version: 1.0.0
  contact:
    name: FintechBankApp Team
    email: support@fintechbankapp.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001/api/v1
    description: Servidor de desenvolvimento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: ID único do usuário
          example: 1
        fullName:
          type: string
          description: Nome completo do usuário
          example: "João da Silva"
        cpf:
          type: string
          description: CPF do usuário
          example: "12345678901"
        email:
          type: string
          format: email
          description: Email do usuário
          example: "joao.silva@example.com"
        balance:
          type: number
          format: float
          description: Saldo atual da conta
          example: 1500.75
        pixDailyLimit:
          type: number
          format: float
          description: Limite diário para PIX
          example: 1000.00
        isBlocked:
          type: boolean
          description: Status de bloqueio do usuário
          example: false
        role:
          type: string
          enum: [customer, admin]
          description: Papel do usuário no sistema
          example: "customer"

    LoginRequest:
      type: object
      required:
        - cpf
        - password
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos
          example: "12345678901"
        password:
          type: string
          minLength: 6
          example: "MinhaSenh@123"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login realizado com sucesso"
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operação realizada com sucesso"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Erro na operação"

    PixCategorizeRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
          description: Descrição da transação a categorizar
          example: "iFood - Pedido #1234"

    PixCategorizeResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        category:
          type: string
          enum: [refeicao, mobilidade, moradia, saude, cultura, compras, educacao, outros]
          example: "refeicao"
        confidence:
          type: integer
          description: Confiança da categorização (0-100)
          example: 92
        reason:
          type: string
          example: "Palavra-chave: ifood"

    FinancialHealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        score:
          type: integer
          description: Score de saúde financeira (0-100)
          example: 78
        creditUtilization:
          type: integer
          description: Percentual de utilização do crédito
          example: 35
        balance:
          type: number
          format: float
          example: 2500.00
        suggestions:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum: [warning, success, info]
              text:
                type: string

    RecurringBill:
      type: object
      properties:
        id:
          type: string
          example: "uuid-xxxx"
        cpf:
          type: string
          example: "11111111111"
        name:
          type: string
          example: "Netflix"
        amount:
          type: number
          format: float
          example: 39.90
        dueDay:
          type: integer
          example: 15
        category:
          type: string
          example: "cultura"
        status:
          type: string
          enum: [pending, paid]
          example: "pending"
        paidAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RecurringBillRequest:
      type: object
      required: [name, amount, dueDay]
      properties:
        name:
          type: string
          example: "Netflix"
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 39.90
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
          example: 15
        category:
          type: string
          example: "cultura"

    StatementExportRequest:
      type: object
      required: [format, filter, transactions]
      properties:
        format:
          type: string
          enum: [pdf, csv]
          example: "csv"
        filter:
          type: string
          enum: [all, filtered]
          example: "all"
        transactions:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date-time
              type:
                type: string
              description:
                type: string
              amount:
                type: number

    Subscription:
      type: object
      properties:
        id:
          type: string
          example: "uuid-xxxx"
        cpf:
          type: string
          example: "11111111111"
        name:
          type: string
          example: "Netflix"
        amount:
          type: number
          format: float
          example: 55.90
        frequency:
          type: string
          enum: [monthly, yearly]
          example: "monthly"
        payment_method:
          type: string
          enum: [debit, credit]
          example: "debit"
        status:
          type: string
          enum: [active, cancelled]
          example: "active"
        next_billing_date:
          type: string
          format: date-time
        last_billing_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionRequest:
      type: object
      required: [name, amount, frequency, payment_method, pin]
      properties:
        name:
          type: string
          example: "Netflix"
        amount:
          type: number
          format: float
          minimum: 0.01
          example: 55.90
        frequency:
          type: string
          enum: [monthly, yearly]
          example: "monthly"
        payment_method:
          type: string
          enum: [debit, credit]
          example: "debit"
        pin:
          type: string
          description: PIN de 4 dígitos (autorização financeira)
          example: "9898"

    SimulateMassRequest:
      type: object
      required: [targetCpf]
      properties:
        targetCpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "11111111111"
        count:
          type: integer
          minimum: 1
          maximum: 200
          default: 5
          description: Quantidade de transações a simular (máx. 200)
          example: 3

    SimulateMassResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "3 transações simuladas para 11111111111."
        transactions:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              amount: { type: number, format: float }
              description: { type: string }

    TransactionCancelRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          description: PIN de 4 dígitos (autorização financeira)
          example: "9898"

    TransactionCancelResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Transação cancelada com sucesso."
        reversal:
          type: object
          properties:
            id: { type: string }
            kind:
              type: string
              enum: [invoice_credit, voucher, debit_refund]
              description: |
                invoice_credit: crédito lançado na fatura ainda aberta (fatura de origem não fechou).
                voucher: fatura de origem já fechada — gera credit voucher em vez de alterar a fatura.
                debit_refund: valor devolvido ao saldo da conta.
            amount: { type: number, format: float }
            description: { type: string }
        voucher:
          $ref: '#/components/schemas/CreditVoucher'

    CreditVoucher:
      type: object
      properties:
        id:
          type: string
          example: "uuid-xxxx"
        cpf:
          type: string
          example: "11111111111"
        amount:
          type: number
          format: float
          example: 120.00
        status:
          type: string
          enum: [active, used, expired]
          example: "active"
        source_transaction_id:
          type: string
        source_invoice_id:
          type: string
          nullable: true
        description:
          type: string
        created_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
          nullable: true

paths:
  /health:
    get:
      tags:
        - Sistema
      summary: Health Check
      description: Verifica se a API está funcionando
      responses:
        '200':
          description: API funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  timestamp:
                    type: string
                    example: "2024-03-20T10:30:00Z"

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Fazer login
      description: Autentica um usuário no sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{cpf}:
    get:
      tags:
        - Usuários
      summary: Consultar usuário
      description: Retorna os dados de um usuário
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{cpf}/statement:
    get:
      tags:
        - Usuários
      summary: Extrato do usuário
      description: Retorna o extrato de transações do usuário
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Extrato do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  transactions:
                    type: array
                    items:
                      type: object

  /admin/users:
    get:
      tags:
        - Administração
      summary: Listar usuários (Admin)
      description: Lista todos os usuários (apenas administradores)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

  /admin/users/{cpf}:
    get:
      tags:
        - Administração
      summary: Consultar usuário (Admin)
      description: Consulta dados de um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/deposit:
    post:
      tags:
        - Administração
      summary: Fazer depósito (Admin)
      description: Realiza um depósito na conta do usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  description: Valor do depósito
                  example: 500.00
      responses:
        '200':
          description: Depósito realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Depósito realizado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/block:
    put:
      tags:
        - Administração
      summary: Bloquear usuário (Admin)
      description: Bloqueia um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário bloqueado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Usuário bloqueado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/unblock:
    put:
      tags:
        - Administração
      summary: Desbloquear usuário (Admin)
      description: Desbloqueia um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário desbloqueado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Usuário desbloqueado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/pix-limit:
    put:
      tags:
        - Administração
      summary: Alterar limite PIX (Admin)
      description: Altera o limite diário PIX de um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newLimit
              properties:
                newLimit:
                  type: number
                  format: float
                  minimum: 0
                  description: Novo limite diário PIX
                  example: 2000.00
      responses:
        '200':
          description: Limite alterado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Limite PIX alterado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/reset-password:
    put:
      tags:
        - Administração
      summary: Resetar senha (Admin)
      description: Reseta a senha de um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  minLength: 6
                  maxLength: 12
                  description: Nova senha
                  example: "nova123"
      responses:
        '200':
          description: Senha resetada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Senha resetada com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/generate-temp-password:
    post:
      tags:
        - Administração
      summary: Gerar senha temporária (Admin)
      description: Gera uma senha temporária para um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Senha temporária gerada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Senha temporária gerada com sucesso"
                  tempPassword:
                    type: string
                    example: "temp1234"
                  user:
                    $ref: '#/components/schemas/User'

  /users/{cpf}/pix-daily-usage:
    get:
      tags: [PIX]
      summary: Uso diario do PIX (valor enviado no dia)
      description: Retorna o total enviado via PIX no dia corrente para o CPF informado.
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  cpf: { type: string, example: '12345678901' }
                  date: { type: string, format: date, example: '2025-11-10' }
                  totalSentToday: { type: number, format: float, example: 250.00 }
        '400':
          description: Erro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /cards/invoice/anticipate:
    post:
      tags: [Card]
      summary: Antecipar parcelas da fatura do cartao
      description: Antecipacao de parcelas com regra de desconto e atualizacao de fatura/transacoes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, pin, installmentTransactionIds]
              properties:
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                pin: { type: string, minLength: 4, maxLength: 4 }
                installmentTransactionIds:
                  type: array
                  items: { type: string }
              example:
                cpf: '12345678901'
                pin: '1234'
                installmentTransactionIds: ['tx-inv-001', 'tx-inv-002']
      responses:
        '200':
          description: Parcelas antecipadas com sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400':
          description: Dados invalidos ou inconsistencia nas parcelas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /user/me/{cpf}:
    get:
      tags: [Users]
      summary: Dados do usuario (compatibilidade)
      description: Retorna dados do usuario, transacoes e contatos PIX (rota de compatibilidade).
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─── Endpoints de Migração new-base (#58) ───────────────────────────────────

  /pix/categorize:
    post:
      tags: [PIX]
      summary: Categorizar transação PIX
      description: |
        Categoriza automaticamente uma transação PIX por palavras-chave e histórico do usuário.
        Substitui a integração com Gemini/AI — lógica local no backend.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PixCategorizeRequest' }
      responses:
        '200':
          description: Categoria identificada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PixCategorizeResponse' }
        '400':
          description: Campo description ausente ou inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /financial-health/{cpf}:
    get:
      tags: [Users]
      summary: Score de saúde financeira
      description: |
        Calcula score de saúde financeira (0-100) baseado em saldo, utilização do crédito
        e histórico de transações dos últimos 90 dias.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
          description: CPF do usuário (apenas o próprio usuário ou admin)
      responses:
        '200':
          description: Score calculado com sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinancialHealthResponse' }
        '403':
          description: Acesso negado (CPF diferente sem ser admin)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /recurring-bills/{cpf}:
    get:
      tags: [Financeiro]
      summary: Listar contas recorrentes
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Lista de contas recorrentes
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  bills:
                    type: array
                    items: { $ref: '#/components/schemas/RecurringBill' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Financeiro]
      summary: Criar conta recorrente
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringBillRequest' }
      responses:
        '201':
          description: Conta criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  bill: { $ref: '#/components/schemas/RecurringBill' }
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /recurring-bills/{cpf}/{billId}:
    put:
      tags: [Financeiro]
      summary: Atualizar conta recorrente
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
        - name: billId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringBillRequest' }
      responses:
        '200':
          description: Conta atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '404':
          description: Conta não encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [Financeiro]
      summary: Remover conta recorrente
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
        - name: billId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Conta removida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /statement/export:
    post:
      tags: [Financeiro]
      summary: Exportar extrato
      description: |
        Exporta extrato em CSV (download direto) ou PDF (retorna JSON estruturado
        para o frontend renderizar com jsPDF).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementExportRequest' }
      responses:
        '200':
          description: Extrato exportado
          content:
            text/csv:
              schema:
                type: string
                description: Arquivo CSV com BOM UTF-8
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  format: { type: string, example: "pdf" }
                  data:
                    type: object
                    properties:
                      generatedAt: { type: string, format: date-time }
                      userCpf: { type: string }
                      totalTransactions: { type: integer }
                      transactions: { type: array, items: { type: object } }
        '400':
          description: Formato ou dados inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /subscriptions/{cpf}:
    get:
      tags: [Financeiro]
      summary: Listar assinaturas (cobrança recorrente)
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Lista de assinaturas
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  subscriptions:
                    type: array
                    items: { $ref: '#/components/schemas/Subscription' }
        '403':
          description: Acesso negado (CPF de outro usuário sem ser admin)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Financeiro]
      summary: Criar assinatura (cobrança recorrente mensal/anual, débito/crédito)
      description: |
        Requer PIN (autorização financeira). Valida bloqueio de cartão/conta
        inadimplente quando payment_method=credit.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionRequest' }
      responses:
        '200':
          description: Assinatura criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  subscription: { $ref: '#/components/schemas/Subscription' }
        '400':
          description: Payload inválido (frequência/forma de pagamento fora da whitelist, valor <= 0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Acesso negado, ou cartão bloqueado/conta inadimplente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /subscriptions/{cpf}/{id}:
    delete:
      tags: [Financeiro]
      summary: Cancelar assinatura
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Assinatura cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '404':
          description: Assinatura não encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Acesso negado (assinatura não pertence ao CPF)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /admin/transactions/simulate-mass:
    post:
      tags: [Administração]
      summary: Simular transações em massa para um usuário (Admin)
      description: |
        Cria N transações SHOP_CREDIT fictícias (prefixo "[SIM]") para testes.
        Limitado a 200 por chamada. Gera log de auditoria.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulateMassRequest' }
      responses:
        '200':
          description: Transações simuladas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulateMassResponse' }
        '400':
          description: targetCpf ausente ou inválido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Usuário alvo não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /transactions/{cpf}/{id}/cancel:
    post:
      tags: [Card]
      summary: Cancelar/estornar transação (débito ou crédito)
      description: |
        Débito devolve o valor ao saldo. Crédito com fatura de origem ainda
        aberta gera crédito direto na fatura atual; crédito com fatura de
        origem já fechada gera credit voucher (a fatura fechada não é
        alterada). Compras parceladas (installment_plans ativo) são bloqueadas
        nesta rota. Sem janela de tempo, mas nunca duas vezes na mesma
        transação. Requer PIN.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
        - name: id
          in: path
          required: true
          schema: { type: string }
          description: ID da transação original a cancelar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCancelRequest' }
      responses:
        '200':
          description: Transação cancelada/estornada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionCancelResponse' }
        '400':
          description: Tipo de transação não reversível, ou compra parcelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Acesso negado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Transação não encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Transação já cancelada anteriormente
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /vouchers/{cpf}:
    get:
      tags: [Card]
      summary: Listar credit vouchers do usuário
      description: |
        Vouchers gerados ao cancelar uma compra a crédito cuja fatura de
        origem já está fechada.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Lista de vouchers
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  vouchers:
                    type: array
                    items: { $ref: '#/components/schemas/CreditVoucher' }
        '403':
          description: Acesso negado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }