openapi: 3.0.0
info:
  title: FintechBankApp API
  description: API completa para o sistema bancário FintechBankApp
  version: 1.0.0
  contact:
    name: FintechBankApp Team
    email: support@fintechbankapp.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001
    description: Servidor de desenvolvimento
  - url: http://localhost:3001/api/v1
    description: Servidor de desenvolvimento (router /api/v1)

tags:
  - name: Sistema
  - name: Autenticação
  - name: Usuários
  - name: PIX
  - name: Shop
  - name: Cartão
  - name: Administração
  - name: Proxy

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required:
        - cpf
        - fullName
        - email
        - balance
        - transactions
        - isBlocked
        - role
        - pixDailyLimit
        - pixKeys
        - pixContacts
        - purchasedItems
        - creditCard
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF do usuário
          example: "12345678901"
        fullName:
          type: string
          description: Nome completo
          example: "João da Silva"
        username:
          type: string
          description: Nome de usuário (opcional)
          example: "joaosilva"
        profileDescription:
          type: string
          description: Descrição do perfil (opcional)
          example: "Cliente premium desde 2021"
        email:
          type: string
          format: email
          description: Email
          example: "joao.silva@example.com"
        balance:
          type: number
          format: float
          description: Saldo em conta
          example: 1500.75
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        isBlocked:
          type: boolean
          description: Status de bloqueio da conta
          example: false
        role:
          type: string
          enum: [user, admin]
          description: Papel no sistema
          example: "user"
        pixDailyLimit:
          type: number
          format: float
          description: Limite diário PIX
          example: 2000
        pixKeys:
          type: array
          items:
            $ref: '#/components/schemas/PixKey'
        pixContacts:
          type: array
          items:
            $ref: '#/components/schemas/PixContact'
        limitIncreaseRequest:
          $ref: '#/components/schemas/LimitIncreaseRequest'
          description: Última solicitação de aumento de limite PIX (quando existir)
        showStoriesPopup:
          type: boolean
          description: Flag de UX para popup de stories
          example: true
        purchasedItems:
          type: array
          items:
            $ref: '#/components/schemas/PurchasedItem'
        creditCard:
          $ref: '#/components/schemas/CreditCard'

    Transaction:
      type: object
      required: [id, type, amount, date, description]
      properties:
        id:
          type: string
          example: "tx-1710171111"
        type:
          type: string
          enum: [PIX_SENT, PIX_RECEIVED, DEPOSIT, PAYMENT, PIX_CREDIT_SENT]
          example: "PIX_SENT"
        amount:
          type: number
          format: float
          example: -100.00
        date:
          type: string
          format: date-time
          example: "2024-03-20T10:30:00.000Z"
        description:
          type: string
          example: "Transferência PIX"
        to:
          type: string
          description: CPF de destino (quando aplicável)
          example: "98765432100"
        from:
          type: string
          description: CPF de origem (quando aplicável)
          example: "12345678901"
        recipientName:
          type: string
          description: Nome do destinatário (quando aplicável)
          example: "Maria Oliveira"
        senderName:
          type: string
          description: Nome do remetente (quando aplicável)
          example: "João da Silva"

    CardTransaction:
      type: object
      required: [id, date, merchant, amount, type]
      properties:
        id:
          type: string
          example: "ctx-1710172222-1"
        date:
          type: string
          format: date-time
          example: "2024-03-20T10:30:00.000Z"
        merchant:
          type: string
          example: "Loja Online"
        amount:
          type: number
          format: float
          example: 199.90
        type:
          type: string
          enum: [CREDIT, PAYMENT, INVOICE_INSTALLMENT]
          example: "INVOICE_INSTALLMENT"
        installments:
          type: string
          description: 'Ex.: "1/12"'
          example: "1/12"
        totalInstallments:
          type: integer
          example: 12
        currentInstallment:
          type: integer
          example: 1

    CreditCard:
      type: object
      required: [number, dueDate, invoiceDueDate, currentInvoice, closedInvoice, availableLimit, totalLimit, pointsBalance, isBlocked, transactions, closedTransactions]
      properties:
        number:
          type: string
          example: "**** **** **** 1234"
        dueDate:
          type: string
          description: Vencimento do cartão (MM/YY)
          example: "12/28"
        invoiceDueDate:
          type: string
          format: date-time
          description: Data de vencimento da fatura atual
          example: "2024-04-15T03:00:00.000Z"
        closedInvoiceDueDate:
          type: string
          format: date-time
          description: Data de vencimento da fatura fechada (quando existir)
          example: "2024-03-15T03:00:00.000Z"
        currentInvoice:
          type: number
          format: float
          example: 450.00
        closedInvoice:
          type: number
          format: float
          example: 1200.00
        availableLimit:
          type: number
          format: float
          example: 800.00
        totalLimit:
          type: number
          format: float
          example: 1000.00
        pointsBalance:
          type: number
          example: 1200
        isBlocked:
          type: boolean
          example: false
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/CardTransaction'
        closedTransactions:
          type: array
          items:
            $ref: '#/components/schemas/CardTransaction'

    PixKey:
      type: object
      required: [type, key]
      properties:
        type:
          type: string
          enum: [CPF, EMAIL]
          example: "CPF"
        key:
          type: string
          example: "12345678901"

    PixContact:
      type: object
      required: [name, key]
      description: >
        Contato PIX. Atenção: por compatibilidade com o schema atual do banco,
        a chave PIX (CPF/EMAIL/TELEFONE/EVP) é persistida na coluna `contact_cpf`.
        Conceitualmente, o nome correto seria `contact_key`. Este contrato usa `key`.
      properties:
        name:
          type: string
          example: "Maria Oliveira"
        key:
          type: string
          description: "Chave PIX (CPF, EMAIL, TELEFONE ou EVP)."
          example: "maria.oliveira@example.com"

    PasswordResetRequest:
      type: object
      required: [cpf, status]
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "12345678901"
        status:
          type: string
          enum: [pending, approved, denied]
          example: "pending"

    LimitIncreaseRequest:
      type: object
      required: [cpf, amount, status]
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "12345678901"
        amount:
          type: number
          format: float
          example: 3000.00
        status:
          type: string
          enum: [pending, approved, denied]
          example: "pending"

    PurchasedItem:
      type: object
      required: [id, name, description, price, imageUrl]
      properties:
        id:
          type: string
          example: "prod-001"
        name:
          type: string
          example: "Fone de Ouvido"
        description:
          type: string
          example: "Fone Bluetooth"
        price:
          type: number
          format: float
          example: 199.90
        imageUrl:
          type: string
          format: uri
        quantity:
          type: integer
          example: 2
        purchaseDate:
          type: string
          format: date-time
          example: "2024-03-18T15:20:00.000Z"
        pointsEarned:
          type: integer
          example: 20

    Story:
      type: object
      required: [id, cpf, imageUrl, createdAt]
      properties:
        id:
          type: string
          example: "story-001"
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "12345678901"
        imageUrl:
          type: string
          format: uri
          example: "https://example.com/story.jpg"
        caption:
          type: string
          example: "Compra aprovada!"
        createdAt:
          type: string
          format: date-time
          example: "2024-03-18T12:00:00.000Z"

    SignUpRequest:
      type: object
      required: [fullName, email, cpf, password]
      properties:
        fullName:
          type: string
          example: "João da Silva"
        email:
          type: string
          format: email
          example: "joao.silva@example.com"
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "12345678901"
        password:
          type: string
          minLength: 6
          example: "MinhaSenh@123"

    LoginRequest:
      type: object
      required: [cpf, password]
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          example: "12345678901"
        password:
          type: string
          minLength: 6
          example: "MinhaSenh@123"

    AuthResponse:
      type: object
      required: [success, message, user, token]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login realizado com sucesso"
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operação realizada com sucesso"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Erro na operação"

    AppNotification:
      type: object
      required:
        - id
        - message
        - created_at
        - is_read
      properties:
        id:
          type: integer
          format: int64
          description: Identificador unico da notificacao
          example: 101
        message:
          type: string
          description: Mensagem detalhada da notificacao
          example: 'Voce recebeu um PIX de R$ 120,00'
        created_at:
          type: string
          format: date-time
          description: Data/hora de criacao no formato ISO 8601
          example: '2025-11-09T10:30:00Z'
        is_read:
          type: boolean
          description: Indica se a notificacao foi lida
          example: false
        title:
          type: string
          nullable: true
          description: Titulo curto da notificacao (opcional)
          example: 'PIX recebido'
        type:
          type: string
          nullable: true
          description: Tipo da notificacao (opcional)
          enum: [info, warning, error, success]
          example: 'success'
        actionUrl:
          type: string
          nullable: true
          description: URL opcional para acao relacionada
          example: '/cards/invoices/2025-11'
        createdAt:
          type: string
          format: date-time
          nullable: true
          deprecated: true
          description: Alias legado para created_at (nao preferencial)
        read:
          type: boolean
          nullable: true
          deprecated: true
          description: Alias legado para is_read (nao preferencial)

paths:
  /health:
    get:
      tags: [Sistema]
      summary: Health Check
      description: Verifica se a API está funcionando
      responses:
        '200':
          description: API funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  timestamp:
                    type: string
                    example: "2024-03-20T10:30:00Z"

  /auth/signup:
    post:
      tags: [Autenticação]
      summary: Cadastro de usuário
      description: Registra um novo usuário com cartão de crédito e limites padrão.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              fullName: "João da Silva"
              email: "joao.silva@example.com"
              cpf: "12345678901"
              password: "MinhaSenh@123"
      responses:
        '200':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Usuário criado com sucesso."
        '400':
          description: Dados inválidos (CPF/email já existente)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "CPF já cadastrado."

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Fazer login
      description: Autentica um usuário no sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              cpf: "12345678901"
              password: "MinhaSenh@123"
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/request-password-reset:
    post:
      tags: [Autenticação]
      summary: Solicitar redefinição de senha
      description: Cria uma solicitação pendente para redefinição de senha do usuário.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf]
              properties:
                cpf:
                  type: string
                  pattern: '^[0-9]{11}$'
            example:
              cpf: "12345678901"
      responses:
        '200':
          description: Solicitação criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Solicitação enviada para aprovação."
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/reset-password:
    post:
      tags: [Autenticação]
      summary: Redefinir senha com token
      description: Redefine a senha usando token (4 últimos dígitos do CPF).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, token, newPassword]
              properties:
                cpf:
                  type: string
                  pattern: '^[0-9]{11}$'
                token:
                  type: string
                  minLength: 4
                  maxLength: 4
                newPassword:
                  type: string
                  minLength: 6
                  maxLength: 12
            example:
              cpf: "12345678901"
              token: "8901"
              newPassword: "nova123"
      responses:
        '200':
          description: Senha redefinida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Senha redefinida com sucesso!"
        '400':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Token de redefinição inválido."

  /users/me:
    get:
      tags: [Usuários]
      summary: Dados do usuário autenticado
      description: Retorna os dados completos do usuário autenticado.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{cpf}:
    get:
      tags: [Usuários]
      summary: Consultar usuário
      description: Retorna os dados de um usuário
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{cpf}/statement:
    get:
      tags: [Usuários]
      summary: Extrato do usuário
      description: Retorna o extrato de transações do usuário
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Extrato do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
              example:
                success: true
                transactions:
                  - id: "tx-1"
                    type: "PIX_SENT"
                    amount: -100
                    date: "2024-03-20T10:30:00.000Z"
                    description: "Transferência PIX"
                    to: "98765432100"

  /users/{cpf}/notifications:
    get:
      tags: [Usuários]
      summary: Listar notificações do usuário
      description: Retorna a lista de notificações do usuário identificado pelo CPF.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          description: CPF do usuário sem máscara.
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          example: '12345678901'
      responses:
        '200':
          description: Lista de notificações do usuário
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AppNotification'
              examples:
                exemplo:
                  summary: Lista de notificações
                  value:
                    - id: 101
                      title: 'Fatura fechada'
                      message: 'Sua fatura de cartão foi fechada'
                      type: 'info'
                      read: false
                      createdAt: '2025-11-09T10:30:00Z'
                      actionUrl: '/cards/invoices/2025-11'
                    - id: 102
                      title: 'PIX recebido'
                      message: 'Você recebeu um PIX de R$ 120,00'
                      type: 'success'
                      read: true
                      createdAt: '2025-11-08T18:45:00Z'

  /users/{cpf}/notifications/{id}/read:
    post:
      tags: [Usuários]
      summary: Marcar notificação como lida
      description: Marca a notificação especificada como lida para o usuário.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          description: CPF do usuário sem máscara.
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          example: '12345678901'
        - name: id
          in: path
          required: true
          description: ID da notificação.
          schema:
            type: integer
            format: int64
          example: 101
      responses:
        '200':
          description: Notificação marcada como lida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              examples:
                sucesso:
                  summary: Operação realizada com sucesso
                  value:
                    success: true
                    message: 'Notificação marcada como lida'
        '404':
          description: Notificação ou usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                naoEncontrado:
                  value:
                    success: false
                    message: 'Usuário ou notificação não encontrada'

  /pix/recipient-info:
    post:
      tags: [PIX]
      summary: Validar chave PIX e obter destinatário
      description: Valida a chave PIX e retorna nome e CPF mascarado. Não permite auto-transferência.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, senderCpf]
              properties:
                key: { type: string }
                senderCpf:
                  type: string
                  pattern: '^[0-9]{11}$'
            example:
              key: "maria.oliveira@example.com"
              senderCpf: "12345678901"
      responses:
        '200':
          description: Destinatário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  name: { type: string }
                  cpf: { type: string, description: CPF mascarado }
              example:
                success: true
                name: "Maria Oliveira"
                cpf: "***.123.456-**"
        '400':
          description: Chave não encontrada ou auto-transferência
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pix/transfer:
    post:
      tags: [PIX]
      summary: Transferência PIX (débito)
      description: Realiza transferência PIX com validação de limite diário e saldo. Requer PIN.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toKey, amount, description, pin]
              properties:
                toKey: { type: string }
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                description: { type: string }
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
            example:
              toKey: "12345678901"
              amount: 100.00
              description: "Transferência PIX"
              pin: "1234"
      responses:
        '200':
          description: PIX enviado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  transaction: { $ref: '#/components/schemas/Transaction' }
              example:
                success: true
                message: "PIX enviado com sucesso!"
                transaction:
                  id: "tx-pix-1710171111"
                  type: "PIX_SENT"
                  amount: -100
                  date: "2024-03-20T10:30:00.000Z"
                  description: "Transferência PIX"
                  to: "98765432100"
                  recipientName: "Maria Oliveira"
        '400':
          description: Saldo insuficiente ou limite excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pix/transfer-credit:
    post:
      tags: [PIX]
      summary: Transferência PIX no crédito
      description: Realiza PIX no crédito com juros simples (5% ao mês). Lança parcelas com datas futuras corretas. Requer PIN.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [toKey, amount, installments, pin]
              properties:
                toKey: { type: string }
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                installments:
                  type: integer
                  minimum: 1
                  maximum: 24
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
            example:
              toKey: "12345678901"
              amount: 300.00
              installments: 6
              pin: "1234"
      responses:
        '200':
