  /shop/checkout:
    post:
      tags: [Shop]
      summary: Checkout de compra
      description: Processa compra (debito ou credito), calcula pontos e salva itens com purchaseDate e pointsEarned. Parcelamento em credito cria transacoes futuras da fatura.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, paymentMethod]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId: { type: string }
                      quantity: { type: integer, minimum: 1 }
                paymentMethod:
                  type: string
                  enum: [debit, credit]
                cashbackUsed:
                  type: number
                  format: float
                  minimum: 0
                installments:
                  type: integer
                  minimum: 1
                  maximum: 24
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
            example:
              items:
                - productId: "prod-001"
                  quantity: 2
              paymentMethod: "credit"
              cashbackUsed: 20
              installments: 6
              pin: "1234"
      responses:
        '200':
          description: Compra realizada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  orderId: { type: string }
              example:
                success: true
                message: "Compra realizada com sucesso."
                orderId: "ord-1710173333"
        '400':
          description: Limite insuficiente ou saldo insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cards/invoice/pay:
    post:
      tags: [Cartão]
      summary: Pagar fatura fechada
      description: Debita saldo da conta, restaura limite, zera closedInvoice e desbloqueia cartão se estava bloqueado. Requer PIN.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, pin]
              properties:
                cpf:
                  type: string
                  pattern: '^[0-9]{11}$'
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
            example:
              cpf: "12345678901"
              pin: "1234"
      responses:
        '200':
          description: Fatura paga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "Fatura paga com sucesso."
        '400':
          description: Saldo insuficiente ou sem fatura fechada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /cards/invoice/parcel:
    post:
      tags: [Cartão]
      summary: Parcelar fatura fechada
      description: Aplica juros (10% simples/mês conforme frontend), cria transações futuras `INVOICE_INSTALLMENT` e ajusta limites; desbloqueia se estava bloqueado. Requer PIN.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, amount, installments, pin]
              properties:
                cpf:
                  type: string
                  pattern: '^[0-9]{11}$'
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                installments:
                  type: integer
                  minimum: 2
                  maximum: 24
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
            example:
              cpf: "12345678901"
              amount: 1200.00
              installments: 12
              pin: "1234"
      responses:
        '200':
          description: Parcelamento realizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Inconsistência de valor ou sem fatura fechada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

