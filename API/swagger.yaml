openapi: 3.0.0
info:
  title: FintechBankApp API
  description: API completa para o sistema bancário FintechBankApp
  version: 1.0.0
  contact:
    name: FintechBankApp Team
    email: support@fintechbankapp.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001/api/v1
    description: Servidor de desenvolvimento local
  - url: http://192.168.0.105:3001/api/v1
    description: Servidor de desenvolvimento (rede local)
  - url: https://api.fintechbankapp.com/api/v1
    description: Servidor de produção

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          description: ID único do usuário
          example: 1
        fullName:
          type: string
          description: Nome completo do usuário
          example: "João da Silva"
        cpf:
          type: string
          description: CPF do usuário
          example: "12345678901"
        email:
          type: string
          format: email
          description: Email do usuário
          example: "joao.silva@example.com"
        balance:
          type: number
          format: float
          description: Saldo atual da conta
          example: 1500.75
        pixDailyLimit:
          type: number
          format: float
          description: Limite diário para PIX (valor padrão ao cadastrar: R$ 2.000,00)
          example: 2000.00
        isBlocked:
          type: boolean
          description: Status de bloqueio do usuário
          example: false
        role:
          type: string
          enum: [customer, admin]
          description: Papel do usuário no sistema
          example: "customer"
        creditCard:
          type: object
          description: Informações do cartão de crédito do usuário
          properties:
            totalLimit:
              type: number
              format: float
              description: Limite total do cartão de crédito (valor padrão ao cadastrar: R$ 5.000,00)
              example: 5000.00
            availableLimit:
              type: number
              format: float
              description: Limite disponível do cartão de crédito (valor padrão ao cadastrar: R$ 5.000,00)
              example: 5000.00
            isBlocked:
              type: boolean
              description: Status de bloqueio do cartão (padrão: false - desbloqueado)
              example: false
            pointsBalance:
              type: integer
              description: Saldo de pontos do cartão (padrão: 0)
              example: 0

    LoginRequest:
      type: object
      required:
        - cpf
        - password
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos
          example: "12345678901"
        password:
          type: string
          minLength: 6
          example: "MinhaSenh@123"

    AuthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Login realizado com sucesso"
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Operação realizada com sucesso"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Erro na operação"

paths:
  /health:
    get:
      tags:
        - Sistema
      summary: Health Check
      description: Verifica se a API está funcionando
      responses:
        '200':
          description: API funcionando
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "OK"
                  timestamp:
                    type: string
                    example: "2024-03-20T10:30:00Z"

  /auth/login:
    post:
      tags:
        - Autenticação
      summary: Fazer login
      description: Autentica um usuário no sistema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/signup:
    post:
      tags:
        - Autenticação
      summary: Cadastrar novo usuário
      description: |
        Cria uma nova conta de usuário no sistema.
        
        **Valores padrão definidos automaticamente ao cadastrar:**
        - Limite diário PIX: R$ 2.000,00
        - Limite total do cartão de crédito: R$ 5.000,00
        - Limite disponível do cartão de crédito: R$ 5.000,00
        - Saldo inicial: R$ 0,00
        - Cartão de crédito: desbloqueado e pronto para uso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - cpf
                - email
                - password
              properties:
                fullName:
                  type: string
                  description: Nome completo do usuário
                  example: "João da Silva"
                cpf:
                  type: string
                  pattern: '^[0-9]{11}$'
                  description: CPF com 11 dígitos (apenas números)
                  example: "12345678901"
                email:
                  type: string
                  format: email
                  description: Email do usuário
                  example: "joao.silva@example.com"
                password:
                  type: string
                  minLength: 6
                  description: Senha do usuário (mínimo 6 caracteres)
                  example: "MinhaSenh@123"
      responses:
        '200':
          description: Conta criada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Conta criada com sucesso!"
        '400':
          description: Dados inválidos ou CPF/email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Erro ao criar conta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{cpf}:
    get:
      tags:
        - Usuários
      summary: Consultar usuário
      description: Retorna os dados de um usuário
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{cpf}/statement:
    get:
      tags:
        - Usuários
      summary: Extrato do usuário
      description: Retorna o extrato de transações do usuário
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Extrato do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  transactions:
                    type: array
                    items:
                      type: object

  /admin/users:
    get:
      tags:
        - Administração
      summary: Listar usuários (Admin)
      description: Lista todos os usuários (apenas administradores)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'

  /admin/users/{cpf}:
    get:
      tags:
        - Administração
      summary: Consultar usuário (Admin)
      description: Consulta dados de um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do usuário
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/deposit:
    post:
      tags:
        - Administração
      summary: Fazer depósito (Admin)
      description: Realiza um depósito na conta do usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  format: float
                  minimum: 0.01
                  description: Valor do depósito
                  example: 500.00
      responses:
        '200':
          description: Depósito realizado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Depósito realizado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/block:
    put:
      tags:
        - Administração
      summary: Bloquear usuário (Admin)
      description: Bloqueia um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário bloqueado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Usuário bloqueado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/unblock:
    put:
      tags:
        - Administração
      summary: Desbloquear usuário (Admin)
      description: Desbloqueia um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário desbloqueado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Usuário desbloqueado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/pix-limit:
    put:
      tags:
        - Administração
      summary: Alterar limite PIX (Admin)
      description: Altera o limite diário PIX de um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newLimit
              properties:
                newLimit:
                  type: number
                  format: float
                  minimum: 0
                  description: Novo limite diário PIX
                  example: 2000.00
      responses:
        '200':
          description: Limite alterado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Limite PIX alterado com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/credit-limit:
    put:
      tags:
        - Administração
      summary: Alterar limite do cartão de crédito (Admin)
      description: Altera o limite total e/ou disponível do cartão de crédito de um usuário (apenas administradores). Se apenas totalLimit for informado, o availableLimit será ajustado automaticamente se necessário.
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                totalLimit:
                  type: number
                  format: float
                  minimum: 0
                  description: Limite total do cartão de crédito
                  example: 5000.00
                availableLimit:
                  type: number
                  format: float
                  minimum: 0
                  description: Limite disponível do cartão de crédito. Será ajustado automaticamente se for maior que totalLimit.
                  example: 4500.00
              description: Pelo menos um dos campos (totalLimit ou availableLimit) deve ser informado
      responses:
        '200':
          description: Limite do cartão de crédito alterado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Limite do cartao de credito atualizado"
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/users/{cpf}/reset-password:
    put:
      tags:
        - Administração
      summary: Resetar senha (Admin)
      description: Reseta a senha de um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  minLength: 6
                  maxLength: 12
                  description: Nova senha
                  example: "nova123"
      responses:
        '200':
          description: Senha resetada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Senha resetada com sucesso"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/generate-temp-password:
    post:
      tags:
        - Administração
      summary: Gerar senha temporária (Admin)
      description: Gera uma senha temporária para um usuário (apenas administradores)
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Senha temporária gerada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Senha temporária gerada com sucesso"
                  tempPassword:
                    type: string
                    example: "temp1234"
                  user:
                    $ref: '#/components/schemas/User'

  /admin/users/{cpf}/card-details:
    post:
      tags:
        - Administração
      summary: Atualizar detalhes do cartão de crédito (Admin)
      description: Atualiza os detalhes do cartão de crédito de um usuário, incluindo datas de vencimento, limites e pontos (apenas administradores). Se a fatura estiver vencida há mais de 7 dias, o cartão será bloqueado automaticamente.
      parameters:
        - name: cpf
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9]{11}$'
          description: CPF do usuário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dueDate:
                  type: string
                  format: date-time
                  description: Data de vencimento do cartão
                  example: "2025-12-31T00:00:00.000Z"
                invoiceDueDate:
                  type: string
                  format: date-time
                  description: Data de vencimento da fatura. Se estiver há mais de 7 dias no passado, o cartão será bloqueado automaticamente.
                  example: "2025-11-30T03:00:00.000Z"
                availableLimit:
                  type: number
                  format: float
                  minimum: 0
                  description: Limite disponível do cartão
                  example: 1800.00
                totalLimit:
                  type: number
                  format: float
                  minimum: 0
                  description: Limite total do cartão
                  example: 2000.00
                pointsBalance:
                  type: integer
                  minimum: 0
                  description: Saldo de pontos do cartão
                  example: 1500
              description: Pelo menos um campo deve ser informado
      responses:
        '200':
          description: Detalhes do cartão atualizados com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Erro de validação (nenhum campo informado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{cpf}/pix-daily-usage:
    get:
      tags: [PIX]
      summary: Uso diario do PIX (valor enviado no dia)
      description: Retorna o total enviado via PIX no dia corrente para o CPF informado.
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  cpf: { type: string, example: '12345678901' }
                  date: { type: string, format: date, example: '2025-11-10' }
                  totalSentToday: { type: number, format: float, example: 250.00 }
        '400':
          description: Erro
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /cards/invoice/anticipate:
    post:
      tags: [Card]
      summary: Antecipar parcelas da fatura do cartao
      description: Antecipacao de parcelas com regra de desconto e atualizacao de fatura/transacoes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cpf, pin, installmentTransactionIds]
              properties:
                cpf: { type: string, pattern: '^[0-9]{11}$' }
                pin: { type: string, minLength: 4, maxLength: 4 }
                installmentTransactionIds:
                  type: array
                  items: { type: string }
              example:
                cpf: '12345678901'
                pin: '1234'
                installmentTransactionIds: ['tx-inv-001', 'tx-inv-002']
      responses:
        '200':
          description: Parcelas antecipadas com sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessResponse' }
        '400':
          description: Dados invalidos ou inconsistencia nas parcelas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /user/me/{cpf}:
    get:
      tags: [Users]
      summary: Dados do usuario (compatibilidade)
      description: Retorna dados do usuario, transacoes e contatos PIX (rota de compatibilidade).
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
