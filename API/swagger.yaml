  /recurring-bills/{cpf}/{billId}/pay:
    post:
      tags: [Financeiro]
      summary: Pagar conta recorrente (débito em conta ou cartão)
      description: |
        Pagamento manual de uma conta recorrente.

        - ACCOUNT_DEBIT debita users.balance (a transação PAYMENT aparece no
          extrato da home, nunca na fatura do cartão); saldo insuficiente
          retorna code=SALDO_INSUFICIENTE.
        - CREDIT_CARD consome credit_card_available_limit e grava PAYMENT com
          sufixo "(Faturado no Cartão)" (linha informativa na fatura aberta,
          sem alterar o total); limite insuficiente retorna code=LIMITE_INSUFICIENTE.
        - O ciclo da conta avança (next_billing_date +1 mês ou +1 ano) e o
          status volta a active com retryCount=0.
        - Upsert: se a conta não existir no banco (só no localStorage do
          frontend), registra com o billId enviado usando name/amount do body.
      security:
        - bearerAuth: []
      parameters:
        - name: cpf
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{11}$' }
        - name: billId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecurringBillPayRequest' }
      responses:
        '200':
          description: Pagamento realizado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message:
                    type: string
                    example: "Pagamento de Netflix realizado com sucesso via débito em conta."
                  bill: { $ref: '#/components/schemas/RecurringBill' }
                  transactionId:
                    type: string
                    example: "a1b2c3d4-0000-4000-8000-000000000000"
                  paymentMethod:
                    type: string
                    enum: [ACCOUNT_DEBIT, CREDIT_CARD]
                    example: ACCOUNT_DEBIT
                  newBalance:
                    type: number
                    format: float
                    description: Saldo atualizado (sempre retornado; para CREDIT_CARD é o saldo em conta, não o limite).
                    example: 6960.16
        '400':
          description: |
            Método inválido, saldo/limite insuficiente (code=SALDO_INSUFICIENTE |
            LIMITE_INSUFICIENTE) ou conta inexistente sem name/amount para upsert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Acesso negado (não é o dono nem admin)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Usuário não encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

