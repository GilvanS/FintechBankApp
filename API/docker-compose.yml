# docker-compose.yml
name: dbautomacao
services:
  database:
    container_name: pgdb
    image: postgres:trixie
    environment:
      POSTGRES_PASSWORD: "pwd123"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - skynet
      
  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: "admin@test.com"
      PGADMIN_DEFAULT_PASSWORD: "pwd123"
    ports:
      - "16543:80"
    depends_on:
      - database
    networks:
      - skynet

networks:
  skynet:
    driver: bridge

volumes:
  pgdata:
    # Volume pré-existente com o banco fintechbank (dados reais) — não recriar
    external: true
    name: 674168372df3aea2f62e43566e4c4b8e5e546a12f770cf4197b6a7f94861d081
