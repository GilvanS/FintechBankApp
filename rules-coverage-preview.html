<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge de Cobertura — Regras de Negócio</title>
<style>
  body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: system-ui, sans-serif; }
  .card { background: #16213e; border-radius: 16px; padding: 48px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  h2 { color: #e0e0e0; font-weight: 400; font-size: 16px; margin: 0 0 24px; letter-spacing: 0.5px; text-transform: uppercase; opacity: 0.7; }
  .badge { margin-bottom: 32px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 300px; margin: 0 auto; }
  .stat { background: #0f3460; border-radius: 10px; padding: 12px; }
  .stat-value { color: #44cc11; font-size: 24px; font-weight: 700; }
  .stat-label { color: #888; font-size: 11px; margin-top: 4px; }
  .footer { color: #555; font-size: 11px; margin-top: 24px; }
</style>
</head>
<body>
<div class="card">
  <h2>📊 Cobertura — Regras de Negócio</h2>
  <div class="badge">
    <img src="rules-coverage.svg" alt="Badge: regras 94%" width="95" height="20">
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-value">17</div><div class="stat-label">Seções no SKILL.md</div></div>
    <div class="stat"><div class="stat-value">16</div><div class="stat-label">Com cross-reference</div></div>
    <div class="stat"><div class="stat-value">9/9</div><div class="stat-label">Âncoras OK</div></div>
    <div class="stat"><div class="stat-value">94%</div><div class="stat-label" style="color:#44cc11">Score</div></div>
  </div>
  <div class="footer">npm run badge:svg • npm run badge:json</div>
</div>
</body>
</html>
