name: CI

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WEB/package-lock.json

      - name: Install dependencies
        run: cd WEB && npm ci

      - name: Run tests
        run: cd WEB && npm test

      - name: Build
        run: cd WEB && npm run build
