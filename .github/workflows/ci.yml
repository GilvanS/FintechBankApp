name: CI

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer]

jobs:
  test-web:
    name: WEB tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WEB/package-lock.json

      - name: Install dependencies
        run: cd WEB && npm ci

      - name: Run tests
        run: cd WEB && npm test -- --coverage

      - name: Build
        run: cd WEB && npm run build

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-for-ci-only
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: API/package-lock.json

      - name: Install dependencies
        run: cd API && npm ci

      - name: Run tests
        run: cd API && npm test -- --forceExit

  validate-business-rules:
    name: Regras de Negócio — Validação
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: API/package-lock.json

      - name: Install API dependencies
        run: cd API && npm ci

      - name: Check SKILL.md rules coverage
        run: cd API && node scripts/validate_skill_rules.js

      - name: Check intra-doc anchors (REGRAS-NEGOCIO-FATURA.md)
        run: cd API && node scripts/validate_anchors.js

      # Smoke dos scripts de auditoria/sincronização (sintaxe + import sem banco).
      # O auditor em si precisa de Postgres real e roda no Windows Task Scheduler
      # (AuditConsistencyDaily) — aqui garantimos que um push não quebre a sintaxe
      # ou o carregamento do módulo puro (audit_helpers.cjs), que os scripts
      # dependem. `node --check` valida sintaxe; o require de audit_helpers.cjs é
      # side-effect-free (sem dotenv/banco), então importar valida o contrato.
      - name: Smoke scripts de auditoria (sintaxe + import)
        run: |
          cd API
          node --check scripts/audit_helpers.cjs
          node --check scripts/sync_dias_atraso.cjs
          node --check scripts/run_audit_consistency_report.js
          node -e "const h = require('./scripts/audit_helpers.cjs'); if (!h.selectAnchors || !h.pagoEfetivo || !h.ANCHOR_SQL || !h.expectedUserStateFor) process.exit(1); console.log('audit_helpers OK')"
