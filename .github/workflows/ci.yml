name: CI

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer]

jobs:
  test-web:
    name: WEB tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WEB/package-lock.json

      - name: Install dependencies
        run: cd WEB && npm ci

      - name: Run tests
        run: cd WEB && npm test -- --coverage

      - name: Build
        run: cd WEB && npm run build

  test-api:
    name: API tests
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-for-ci-only
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: API/package-lock.json

      - name: Install dependencies
        run: cd API && npm ci

      - name: Run tests
        run: cd API && npm test -- --forceExit
