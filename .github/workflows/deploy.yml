name: Deploy to GitHub Pages

on:
  push:
    branches: [developer]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WEB/package-lock.json

      - name: Install dependencies
        run: cd WEB && npm ci

      - name: Build for GitHub Pages (demo mode)
        run: cd WEB && npm run build
        env:
          VITE_USE_MOCK_API: 'true'

      # O Pages serve arquivos estáticos: uma rota do React Router (/login, /dashboard)
      # não existe em disco e devolveria 404 em deep-link ou refresh. Servindo o mesmo
      # HTML como 404.html, o router assume a rota no cliente.
      - name: SPA fallback for client-side routes
        run: cp WEB/dist/index.html WEB/dist/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./WEB/dist
