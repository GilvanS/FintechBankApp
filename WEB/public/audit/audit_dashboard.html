<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f13">
<title>Dashboard — Auditoria de Pagamentos FintechBank</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: dark;
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #24243a;
    --border: #2a2a44;
    --text: #e8e8f0;
    --text2: #9898b8;
    --green: #00e676;
    --green-bg: rgba(0,230,118,0.08);
    --red: #ff5252;
    --red-bg: rgba(255,82,82,0.08);
    --amber: #ffd740;
    --amber-bg: rgba(255,215,64,0.08);
    --blue: #448aff;
    --blue-bg: rgba(68,138,255,0.08);
    --purple: #b388ff;
    --purple-bg: rgba(179,136,255,0.08);
    --cyan: #18ffff;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --accent: #18ffff;
    --accent-soft: rgba(24,255,255,0.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    min-height: 100vh;
    touch-action: manipulation;
    -webkit-tap-highlight-color: var(--accent-soft);
  }
  .container { max-width: 1200px; margin: 0 auto; }

  /* Focus visivel unico para todo elemento interativo */
  a, button, summary, [tabindex] { outline-offset: 2px; }
  a:focus-visible, button:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
  }
  .skip-link {
    position: absolute; left: 8px; top: -48px; z-index: 200;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: var(--surface2); color: var(--text); text-decoration: none;
    transition: top 150ms ease-out;
  }
  .skip-link:focus-visible { top: 8px; }
  h1, h2 { text-wrap: balance; }
  [id] { scroll-margin-top: 16px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 24px;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
  .header .sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .header .badge {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600;
    background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,215,64,0.25);
  }

  /* KPI Grid */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin-bottom: 24px;
  }
  .kpi-card {
    padding: 18px 20px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; gap: 6px;
    transition: box-shadow 250ms ease-out, transform 250ms ease-out;
  }
  .kpi-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.45); transform: translateY(-2px); }
  .kpi-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2); }
  .kpi-card .value { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi-card .sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

  /* Section */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
    transition: box-shadow 250ms ease-out, transform 250ms ease-out;
  }
  .section:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.45); transform: translateY(-2px); }
  .section-title {
    font-size: 15px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .count {
    font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px;
    background: var(--surface2); color: var(--text2);
  }

  /* Table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px; color: var(--text2);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr { transition: background-color 200ms ease-out; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: none; }
  td.num, .bar-label, .mini-table td { font-variant-numeric: tabular-nums; }

  /* Status badges */
  .status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .status-ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
  .status-discrepancy { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,82,82,0.2); }
  .status-resolvido { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(68,138,255,0.2); }
  .status-orphan { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,215,64,0.2); }

  /* Bar comparison */
  /* Duas linhas (pagamentos / valor pago) em grid: em flex de coluna estreita as
     barras colapsavam para ~12px e a comparacao ficava ilegivel. */
  .bar-row { display: grid; grid-template-columns: max-content minmax(90px, 1fr); gap: 6px 10px; align-items: center; }
  .bar-wrap { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; position: relative; }
  /* scaleX em vez de width: anima no compositor, sem reflow por frame */
  .bar-fill {
    height: 100%; width: 100%; border-radius: 4px;
    transform: scaleX(var(--pct, 0)); transform-origin: left center;
    transition: transform 800ms ease-out;
  }
  .bar-fill.pmt { background: var(--blue); }
  .bar-fill.inv { background: var(--green); }
  .bar-fill.diff { background: var(--red); }
  .bar-label { font-size: 11px; font-weight: 600; min-width: 60px; text-align: right; white-space: nowrap; }

  /* Mini table */
  .mini-table { font-size: 12px; }
  .mini-table td { padding: 4px 8px; border: none; }
  .mini-table tr td:first-child { color: var(--text2); }

  /* Category grid */
  .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 10px; }
  .cat-item {
    padding: 14px 16px; background: var(--surface2); border-radius: 8px;
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid transparent;
  }
  .cat-item.pass { border-color: rgba(0,230,118,0.15); }
  .cat-item.fail { border-color: rgba(255,82,82,0.15); }
  .cat-item .clabel { font-size: 12px; color: var(--text2); }
  .cat-item .cval { font-size: 16px; font-weight: 700; }

  /* Details toggle */
  .details-toggle {
    font-size: 11px; color: var(--blue); cursor: pointer;
    padding: 4px 8px; border-radius: 6px; background: var(--blue-bg);
    border: none; font-weight: 600;
    transition: background-color 150ms ease-out, color 150ms ease-out;
  }
  .details-toggle:hover { background: rgba(68,138,255,0.28); color: #cfe2ff; }
  .details-content { display: none; margin-top: 8px; padding: 10px; background: var(--surface2); border-radius: 8px; font-size: 12px; }
  .details-content.open { display: block; }
  .details-content table { font-size: 11px; }
  .details-content th { padding: 4px 6px; }
  .details-content td { padding: 4px 6px; }

  /* Pagination */
  .page-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
  .page-btn {
    padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background-color 150ms ease-out, border-color 150ms ease-out;
  }
  .page-btn:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
  .page-btn:disabled { opacity: 0.4; cursor: default; }
  .page-info { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .cat-grid { grid-template-columns: 1fr; }
  }

  /* Movimento reduzido: obrigatorio onde ha transition/@keyframes */
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .section:hover, .kpi-card:hover { transform: none; }
    .bar-fill { transition: none; }
  }

  /* Filtros / erro / loading (consulta live) */
  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .filters label { font-size: 12px; font-weight: 600; color: var(--text2); }
  .filters input {
    padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; width: 160px;
  }
  .btn-primary, .btn-secondary {
    padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none;
  }
  .btn-primary { background: var(--accent); color: #001014; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .error-box {
    padding: 12px 16px; background: var(--red-bg); border: 1px solid rgba(255,82,82,0.25);
    border-radius: 8px; font-size: 13px; color: var(--red); margin-bottom: 14px;
  }
  .loading-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; align-items: center; justify-content: center;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--surface2);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tip-box {
    padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; color: var(--text2); margin-top: 12px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  @media (prefers-reduced-motion: reduce) {
    .spinner { animation: none; opacity: 0.8; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#app">Pular para o conteúdo</a>

<div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <span class="sr-only" id="loading-text"></span>
</div>

<main class="container" id="app"></main>

<script>
// ─── Dados de exemplo (fallback quando a API não responde) ────────────────
const API_BASE = window.location.origin + '/api';
const SAMPLE = {
  success: true,
  scanned: 0, withPayments: 0, discrepancies: 0,
  details: [],
  tip: '📦 Dados de exemplo — consulte a API para ver os dados reais.'
};

let data = SAMPLE;
let dataRanAt = new Date();

// ─── Helpers ─────────────────────────────────────────────────────────────
const fmt = (v) => 'R$ ' + v.toFixed(2).replace('.', ',');
const fmtDate = (s) => { if (!s) return '—'; const d=new Date(s); return d.toLocaleDateString('pt-BR'); };
const shortCpf = (c) => c ? c.substring(0,3)+'.'+c.substring(3,6)+'.'+c.substring(6,9)+'-'+c.substring(9) : '—';

const statusConfig = {
  'ok':             { cls:'status-ok',          icon:'✓', label:'OK' },
  'discrepancy':    { cls:'status-discrepancy',  icon:'⚠', label:'Discrepância' },
  'resolvido':      { cls:'status-resolvido',    icon:'◉', label:'Resolvido' },
  'orphan_payments':{ cls:'status-orphan',       icon:'○', label:'Pag. Órfão' },
};

function statusBadge(st) {
  const c = statusConfig[st] || statusConfig.ok;
  return `<span class="status ${c.cls}">${c.icon} ${c.label}</span>`;
}

function barCell(pmt, inv, maxVal) {
  const m = Math.max(maxVal, 1);
  const pw = Math.min((pmt / m) * 100, 100);
  const iw = Math.min((inv / m) * 100, 100);
  return `<div class="bar-row">
    <span class="bar-label" style="color:var(--blue)">${fmt(pmt)}</span>
    <div class="bar-wrap"><div class="bar-fill pmt" style="--pct:${(pw / 100).toFixed(4)}"></div></div>
    <span class="bar-label" style="color:var(--green)">${fmt(inv)}</span>
    <div class="bar-wrap"><div class="bar-fill inv" style="--pct:${(iw / 100).toFixed(4)}"></div></div>
  </div>`;
  // grid 2x2: linha 1 = pagamentos (azul), linha 2 = valor_pago (verde)
}

// ─── Render ──────────────────────────────────────────────────────────────
const PER_PAGE = 5;
let currentPage = 0;

function render(d) {
  const users = d.details || [];
  const maxPayment = Math.max(...users.map(u => u.paymentTotal || 0), 1);
  const resolved = users.filter(u => u.status === 'resolvido').length;
  const activeDisc = (d.discrepancies || 0) - resolved;
  const totalPages = Math.max(1, Math.ceil(users.length / PER_PAGE));
  const start = currentPage * PER_PAGE;
  const end = Math.min(start + PER_PAGE, users.length);
  const pageUsers = users.slice(start, end);

  const $ = (id) => document.getElementById(id);

  // KPI
  $('kpi-users').textContent = d.withPayments ?? 0;
  $('kpi-disc').textContent = activeDisc;
  $('kpi-resolved').textContent = resolved;
  $('badge-anomalias').textContent = (d.discrepancies || 0) > 0
    ? `⚠️ ${d.discrepancies} anomalia(s)` : '✅ Dados íntegros';
  const tipBox = $('tip-box');
  if (tipBox) {
    if (d.tip) { tipBox.textContent = d.tip; tipBox.hidden = false; }
    else { tipBox.hidden = true; }
  }

  // Table body
  const tbody = $('tbody');
  tbody.innerHTML = pageUsers.map(u => {
    const inv = u.invoices[0] || {};
    const invCount = u.invoices.length;
    const pmtCount = u.payments.length;
    const hasMissingDate = invCount > 0 && !inv.dataPagamento && (inv.valorPago || 0) > 0;

    return `<tr>
      <td><strong>${u.name}</strong><br><span style="font-size:11px;color:var(--text2)">${shortCpf(u.cpf)}</span></td>
      <td>${statusBadge(u.status)}${hasMissingDate ? '<br><span style="font-size:10px;color:var(--amber)">sem data_pagamento</span>' : ''}</td>
      <td>${barCell(u.paymentTotal, u.invoiceTotalPago, maxPayment)}</td>
      <td class="num" style="text-align:center">
        <span style="font-size:13px;font-weight:700;color:${u.diff > 0.02 ? 'var(--red)' : 'var(--green)'}">
          ${u.diff > 0.02 ? fmt(u.diff) : '—'}
        </span>
      </td>
      <td><button type="button" class="details-toggle" id="tgl-${u.cpf}" aria-expanded="false" aria-controls="det-${u.cpf}" onclick="toggleDetails('${u.cpf}')">${pmtCount} pag. / ${invCount} fat.</button></td>
    </tr>
    <tr id="det-${u.cpf}" class="details-content" style="display:none">
      <td colspan="5">
        <table style="width:100%">
          <thead><tr><th>Data</th><th>Valor</th><th>Tipo</th><th>Descrição</th></tr></thead>
          <tbody>
            ${u.payments.map(p => `<tr>
              <td>${fmtDate(p.date)}</td>
              <td style="color:var(--blue);font-weight:600">${fmt(p.amount)}</td>
              <td><span class="status status-ok" style="font-size:10px">Pagamento</span></td>
              <td style="color:var(--text2)">${p.description || '—'}</td>
            </tr>`).join('')}
            ${u.invoices.map(i => `<tr>
              <td>${fmtDate(i.dueDate)}</td>
              <td style="color:var(--green);font-weight:600">${fmt(i.valorTotal)}</td>
              <td><span class="status ${i.dataPagamento ? 'status-ok' : 'status-orphan'}" style="font-size:10px">${i.dataPagamento ? 'Paga' : 'Não Paga'}</span></td>
              <td style="color:var(--text2)">Fatura ${i.status || '—'} · valor_pago: ${fmt(i.valorPago||0)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </td>
    </tr>`;
  }).join('');

  // Pagination
  $('page-info').textContent = users.length ? `${start + 1}–${end} de ${users.length}` : '0 de 0';
  $('page-prev').disabled = currentPage === 0;
  $('page-next').disabled = currentPage >= totalPages - 1;
  $('sec-double-count').textContent = `${users.length} usuário(s)`;
}

function toggleDetails(cpf) {
  const el = document.getElementById('det-' + cpf);
  if (!el) return;
  const willOpen = el.style.display === 'none';
  el.style.display = willOpen ? 'table-row' : 'none';
  document.getElementById('tgl-' + cpf)?.setAttribute('aria-expanded', String(willOpen));
}

function prevPage() { if (currentPage > 0) { currentPage--; render(data); } }
function nextPage() {
  const totalPages = Math.max(1, Math.ceil((data.details || []).length / PER_PAGE));
  if (currentPage < totalPages - 1) { currentPage++; render(data); }
}

// ─── Auth / Fetch (mesmo padrão de audit_consistency_dashboard.html) ──────
function showError(msg) {
  const box = document.getElementById('error-box');
  if (!box) return;
  box.hidden = false;
  box.textContent = msg;
}
function clearError() {
  const box = document.getElementById('error-box');
  if (box) { box.hidden = true; box.textContent = ''; }
}

/**
 * Token de admin. NUNCA embutir credencial neste arquivo — ele é versionado.
 * O operador faz login no painel admin (mesma origem) e o token fica no
 * localStorage; este dashboard só o reaproveita.
 */
function getAdminToken() {
  for (const k of ['adminToken', 'token', 'authToken', 'admin_token']) {
    const v = window.localStorage.getItem(k);
    if (v) return v;
  }
  return null;
}

async function fetchData() {
  const cpf = document.getElementById('cpf-input')?.value.replace(/\D/g, '') || '';
  clearError();

  const token = getAdminToken();
  if (!token) {
    showError('Sessão de admin não encontrada. Faça login no painel admin nesta mesma origem e recarregue esta página, ou use "Dados de Exemplo".');
    return;
  }

  document.getElementById('loading-overlay')?.classList.add('active');

  try {
    const params = new URLSearchParams();
    if (cpf) params.set('cpf', cpf);
    params.set('limit', '200');

    const res = await fetch(API_BASE + '/admin/audit-double-count?' + params.toString(), {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.message || 'Erro na consulta');

    data = json;
    dataRanAt = new Date();
    currentPage = 0;
    render(data);
    $id('last-update').textContent = '🔄 Atualizado: ' + dataRanAt.toLocaleString('pt-BR');
  } catch (err) {
    showError('Não foi possível consultar a API: ' + err.message + ' — verifique se o backend está no ar em ' + API_BASE + ' e se sua sessão de admin continua válida.');
  } finally {
    document.getElementById('loading-overlay')?.classList.remove('active');
  }
}

function loadSample() {
  data = SAMPLE;
  dataRanAt = new Date();
  currentPage = 0;
  render(data);
  $id('last-update').textContent = '📦 Dados de exemplo';
}

const $id = (id) => document.getElementById(id);

// ─── Mount (shell estático — render() preenche os valores dinâmicos) ──────
document.getElementById('app').innerHTML = `
  <!-- Header -->
  <div class="header">
    <div>
      <h1><span aria-hidden="true">📊</span> Auditoria de Pagamentos (Double-Counting)</h1>
      <div class="sub"><span translate="no">FintechBankApp</span> · Compara pagamentos (INVOICE_PAYMENT) com invoices.valor_pago</div>
    </div>
    <span class="badge" id="badge-anomalias">—</span>
  </div>

  <!-- KPI Cards -->
  <div class="kpi-grid">
    <div class="kpi-card"><div class="label">Usuários</div><div class="value" id="kpi-users">—</div><div class="sub">com INVOICE_PAYMENT</div></div>
    <div class="kpi-card"><div class="label">Discrepâncias</div><div class="value" id="kpi-disc" style="color:var(--red)">—</div><div class="sub">pagamentos × valor_pago</div></div>
    <div class="kpi-card"><div class="label">Resolvidas</div><div class="value" id="kpi-resolved" style="color:var(--blue)">—</div><div class="sub">correção anterior</div></div>
  </div>

  <!-- Audit: Double-Counting -->
  <section class="section" aria-labelledby="sec-double">
    <h2 class="section-title" id="sec-double">
      <span aria-hidden="true">📋</span> Double-Counting de Pagamentos
      <span class="count" id="sec-double-count">— usuários</span>
    </h2>

    <div class="filters">
      <label for="cpf-input">CPF</label>
      <input type="text" id="cpf-input" name="cpf" inputmode="numeric" autocomplete="off" spellcheck="false"
             placeholder="11 dígitos" maxlength="11" oninput="this.value=this.value.replace(/\\D/g,'')" />
      <button type="button" class="btn-primary" onclick="fetchData()"><span aria-hidden="true">🔍</span> Consultar</button>
      <button type="button" class="btn-secondary" onclick="loadSample()"><span aria-hidden="true">📦</span> Dados de Exemplo</button>
      <span style="font-size:11px;color:var(--text2);margin-left:auto" id="last-update" aria-live="polite">—</span>
    </div>
    <div id="error-box" role="alert" aria-live="assertive" hidden></div>

    <div class="table-wrap">
      <table>
        <thead><tr>
          <th style="width:22%">Usuário</th>
          <th style="width:12%">Status</th>
          <th style="width:40%">Pagamentos vs Valor Pago</th>
          <th style="width:12%;text-align:center">Diferença</th>

        </tr></thead>
        <tbody id="tbody"></tbody>

    </div>
    <div class="page-controls">
      <button type="button" class="page-btn" id="page-prev" onclick="prevPage()"><span aria-hidden="true">←</span> Anterior</button>
