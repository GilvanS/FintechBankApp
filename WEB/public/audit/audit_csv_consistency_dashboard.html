<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b12">
<title>Dashboard — CSV de Massas × Backend</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    color-scheme: dark;
    --bg: #0b0b12;
    --surface: #161622;
    --surface2: #1e1e32;
    --surface3: #282844;
    --border: #2a2a44;
    --text: #e8e8f0;
    --text2: #9090b8;
    --text3: #606088;
    --green: #00e676;
    --green-bg: rgba(0,230,118,0.10);
    --red: #ff5252;
    --red-bg: rgba(255,82,82,0.10);
    --amber: #ffd740;
    --amber-bg: rgba(255,215,64,0.10);
    --blue: #448aff;
    --blue-bg: rgba(68,138,255,0.10);
    --purple: #b388ff;
    --purple-bg: rgba(179,136,255,0.10);
    --cyan: #18ffff;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --accent: #18ffff;
    --accent-soft: rgba(24,255,255,0.06);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
    touch-action: manipulation;
    -webkit-tap-highlight-color: var(--accent-soft);
  }
  .container { max-width: 1100px; margin: 0 auto; }

  a, button, input, summary, [tabindex] { outline-offset: 2px; }
  a:focus-visible, button:focus-visible, input:focus-visible,
  summary:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
  }
  .skip-link {
    position: absolute; left: 8px; top: -48px; z-index: 200;
    padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: var(--surface2); color: var(--text); text-decoration: none;
    transition: top 150ms ease-out;
  }
  .skip-link:focus-visible { top: 8px; }
  h1, h2 { text-wrap: balance; }
  [id] { scroll-margin-top: 16px; }

  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 20px;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
  .header h1 span { background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header .sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .header .status-badge {
    padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .header .status-badge.all-ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
  .header .status-badge.has-issues { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,82,82,0.2); }

  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .kpi-card {
    padding: 16px 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
    transition: box-shadow 250ms ease-out, transform 250ms ease-out;
  }
  .kpi-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.5); transform: translateY(-2px); }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .kpi-card.green::before { background: var(--green); }
  .kpi-card.red::before { background: var(--red); }
  .kpi-card.blue::before { background: var(--blue); }
  .kpi-card.amber::before { background: var(--amber); }
  .kpi-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text2); }
  .kpi-card .value { font-size: 30px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-card .sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .kpi-card .value.green { color: var(--green); }
  .kpi-card .value.red { color: var(--red); }
  .kpi-card .value.blue { color: var(--blue); }
  .kpi-card .value.amber { color: var(--amber); }

  .charts-row {
    display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 20px;
  }

  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
    transition: box-shadow 250ms ease-out, transform 250ms ease-out;
  }
  .chart-card:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.5); transform: translateY(-2px); }
  .chart-card .title {
    font-size: 13px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .chart-card .title .count { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--surface2); color: var(--text2); }

  .donut-wrap {
    display: flex; align-items: center; justify-content: center; gap: 24px;
  }
  .donut {
    position: relative; width: 160px; height: 160px; flex-shrink: 0;
  }
  .donut svg { transform: rotate(-90deg); }
  .donut-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center;
  }
  .donut-center .pct { font-size: 28px; font-weight: 800; }
  .donut-center .pct-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .donut-legend .item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .donut-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend .item .val { font-weight: 700; margin-left: auto; }

  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
    transition: box-shadow 250ms ease-out, transform 250ms ease-out;
  }
  .section:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.5); transform: translateY(-2px); }
  .section-title {
    font-size: 15px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .count {
    font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 10px;
    background: var(--surface2); color: var(--text2);
  }

  .filters {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
  }
  .filters label { font-size: 12px; font-weight: 600; color: var(--text2); }
  .filters input {
    padding: 8px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px; width: 160px;
    font-variant-numeric: tabular-nums;
    transition: border-color 150ms ease-out, background-color 150ms ease-out;
  }
  .filters input:focus-visible { border-color: var(--accent); }
  .filters input::placeholder { color: var(--text3); }
  .filters button {
    padding: 8px 18px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: background-color 150ms ease-out, box-shadow 150ms ease-out;
  }
  .filters .btn-primary { background: var(--blue); color: #fff; }
  .filters .btn-primary:hover { background: #3d7cff; box-shadow: 0 2px 12px rgba(68,138,255,0.3); }
  .filters .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .filters .btn-secondary:hover { background: var(--border); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.7px; color: var(--text2);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-variant-numeric: tabular-nums; }
  tbody tr { transition: background-color 200ms ease-out, opacity 200ms ease-out; }
  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.inconsistent-row td { border-left: 3px solid var(--red); }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  }
  .badge-ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
  .badge-warn { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,215,64,0.2); }
  .badge-err { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,82,82,0.2); }
  .badge-info { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(68,138,255,0.2); }

  .pagination {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .page-btn {
    padding: 6px 16px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer;
    transition: background-color 150ms ease-out, border-color 150ms ease-out;
  }
  .page-btn:hover:not(:disabled) { background: var(--border); border-color: var(--accent); }
  .page-btn:disabled { opacity: 0.3; cursor: default; }
  .page-info { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }

  .empty-state {
    text-align: center; padding: 32px; color: var(--text3);
    font-size: 14px;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
  .error-box {
    padding: 12px 16px; background: var(--red-bg); border: 1px solid rgba(255,82,82,0.25);
    border-radius: 8px; font-size: 13px; color: var(--red); margin-top: 12px;
  }

  .loading-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; align-items: center; justify-content: center;
    overscroll-behavior: contain;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--surface3);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tip-box {
    padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; color: var(--text2); margin-top: 12px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .tip-box .tip-icon { font-size: 16px; flex-shrink: 0; }

  .tt { position: relative; cursor: help; border-bottom: 1px dotted var(--text3); }
  .tt:hover::after, .tt:focus-visible::after {
    content: attr(data-tip); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
    background: var(--surface2); color: var(--text); padding: 6px 10px; border-radius: 6px;
    font-size: 11px; white-space: nowrap; border: 1px solid var(--border); z-index: 10;
  }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .kpi-card { padding: 12px 14px; }
    .kpi-card .value { font-size: 22px; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .donut-wrap { flex-direction: column; }
    .filters input { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .section:hover, .kpi-card:hover, .chart-card:hover { transform: none; }
    .spinner { border-top-color: var(--blue); opacity: 0.8; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#app">Pular para o conteúdo</a>

<div class="loading-overlay" id="loading-overlay" role="status" aria-live="polite">
  <div class="spinner" aria-hidden="true"></div>
  <span class="sr-only" id="loading-text"></span>
</div>

<main class="container" id="app"></main>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  Dashboard — CSV de Massas × Backend
//  Compara fatura_fechada/fatura_aberta do CSV (tblDeMassasExport.cjs, fonte do
//  botão "Exportar CSV" e do script standalone) contra o cálculo real do backend
//  (enrichUserCreditCardData). Auto-contido — sem dependências externas.
// ════════════════════════════════════════════════════════════════════════════

const API_BASE = window.location.origin + '/api';
const SAMPLE = {
  "success": true,
  "summary": { "totalScanned": 30, "consistent": 30, "divergent": 0 },
  "details": [],
  "filters": { "cpf": null, "limit": 100 },
  "tip": "✅ 100% consistente — nenhuma ação necessária."
};

const fmt = (v) => v.toLocaleString('pt-BR');
const fmtBRL = (v) => (v ?? 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const shortCpf = (c) => c ? c.substring(0,3)+'.'+c.substring(3,6)+'.'+c.substring(6,9)+'-'+c.substring(9) : '—';

let data = SAMPLE;
let currentPage = 0;
const PER_PAGE = 8;

if (window.location.protocol === 'file:') {
  console.warn('[audit-csv-consistency-dashboard] Aberto como file:// — fetch API não funcionará.');
}

function renderDonut(pct, label, color) {
  const r = 70;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  return `<div class="donut">
    <svg width="160" height="160" viewBox="0 0 160 160" aria-hidden="true" focusable="false">
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="14"/>
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="${color}" stroke-width="14"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
        stroke-linecap="round" style="transition: stroke-dashoffset 1.2s ease"/>
    </svg>
    <div class="donut-center">
      <div class="pct" style="color:${color}">${pct.toFixed(1)}%</div>
      <div class="pct-label">${label}</div>
    </div>
  </div>`;
}

function render(data) {
  const s = data.summary || { totalScanned: 0, consistent: 0, divergent: 0 };
  const details = data.details || [];
  const hasIssues = (s.divergent || 0) > 0;
  const pct = s.totalScanned > 0 ? ((s.consistent / s.totalScanned) * 100) : 100;

  const totalPages = Math.ceil(details.length / PER_PAGE);
  const start = currentPage * PER_PAGE;
  const end = Math.min(start + PER_PAGE, details.length);
  const pageDetails = details.slice(start, end);

  document.getElementById('app').innerHTML = `
    ${window.location.protocol === 'file:' ? `
    <div style="padding:12px 16px;background:var(--amber-bg);border:1px solid rgba(255,215,64,0.2);border-radius:var(--radius);margin-bottom:16px;font-size:13px;color:var(--amber);display:flex;align-items:center;gap:10px">
      <span>⚠️</span>
      <div><strong>Modo arquivo local detectado</strong> — a consulta à API não funcionará diretamente.
      <br>Sirva este arquivo via servidor HTTP ou use <strong>"📦 Dados de Exemplo"</strong> abaixo.</div>
    </div>
    ` : ''}

    <div class="header">
      <div>
        <h1><span aria-hidden="true">📊</span> <span>CSV de Massas</span> × Backend</h1>
        <div class="sub">Compara <code translate="no">fatura_fechada</code>/<code translate="no">fatura_aberta</code> do CSV contra <code translate="no">enrichUserCreditCardData</code> (mesmo motor da tela Web/Admin)</div>
      </div>
      <div class="status-badge ${hasIssues ? 'has-issues' : 'all-ok'}">
        ${hasIssues ? '⚠️ ' + fmt(s.divergent) + ' massa(s) divergente(s)' : '✅ Dados íntegros'}
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card blue">
        <div class="label">Massas Escaneadas</div>
        <div class="value blue">${fmt(s.totalScanned)}</div>
        <div class="sub">CPFs verificados</div>
      </div>
      <div class="kpi-card green">
        <div class="label">Consistentes</div>
        <div class="value green">${fmt(s.consistent)}</div>
        <div class="sub"><span class="tt" tabindex="0" data-tip="Diferença ≤ R$ 0,02 entre CSV e backend, nos dois campos">CSV bate com o backend</span></div>
      </div>
      <div class="kpi-card ${(s.divergent || 0) > 0 ? 'red' : 'green'}">
        <div class="label">Divergentes</div>
        <div class="value ${(s.divergent || 0) > 0 ? 'red' : 'green'}">${fmt(s.divergent)}</div>
        <div class="sub">fatura_fechada e/ou fatura_aberta diferem</div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="title">🎯 Consistência CSV × Backend <span class="count">${s.totalScanned} CPFs</span></div>
        <div class="donut-wrap">
          ${renderDonut(pct, 'consistentes', 'var(--green)')}
          <div class="donut-legend">
            <div class="item"><div class="dot" style="background:var(--green)"></div> Consistentes <span class="val" style="color:var(--green)">${fmt(s.consistent)}</span></div>
            <div class="item"><div class="dot" style="background:var(--red)"></div> Divergentes <span class="val" style="color:${(s.divergent||0) > 0 ? 'var(--red)' : 'var(--text2)'}">${fmt(s.divergent)}</span></div>
          </div>
        </div>
      </div>
    </div>

    <section class="section" aria-labelledby="sec-detalhes">
      <h2 class="section-title" id="sec-detalhes">
        <span aria-hidden="true">🔍</span> Massas Divergentes
        <span class="count">${details.length} divergente(s)</span>
      </h2>

      <div class="filters">
        <label for="cpf-input">CPF</label>
        <input type="text" id="cpf-input" name="cpf" inputmode="numeric" autocomplete="off" spellcheck="false"
               placeholder="11 dígitos, ex.: 12310012300…" maxlength="11"
               oninput="this.value=this.value.replace(/\\D/g,'')" />
        <button type="button" class="btn-primary" onclick="fetchData()"><span aria-hidden="true">🔍</span> Consultar</button>
        <button type="button" class="btn-secondary" onclick="loadSample()"><span aria-hidden="true">📦</span> Carregar Dados de Exemplo</button>
        <span style="font-size:11px;color:var(--text3);margin-left:auto;" id="last-update" aria-live="polite">Última: ${new Date().toLocaleString('pt-BR')}</span>
      </div>
      <div id="error-box" role="alert" aria-live="assertive" hidden></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:18%">Usuário</th>
              <th style="width:10%">Status CSV</th>
              <th style="width:12%">Fechada (CSV)</th>
              <th style="width:12%">Fechada (real)</th>
              <th style="width:10%">Diff</th>
              <th style="width:12%">Aberta (CSV)</th>
              <th style="width:12%">Aberta (real)</th>
              <th style="width:10%">Diff</th>
            </tr>
          </thead>
          <tbody id="detail-tbody"></tbody>
        </table>
      </div>

      ${details.length === 0 ? `
        <div class="empty-state">
          <div class="icon">✅</div>
          <div>Todas as massas verificadas estão consistentes — CSV bate com o backend.</div>
          ${s.totalScanned > 0 ? `<div style="margin-top:8px;font-size:12px;color:var(--text2)">${fmt(s.totalScanned)} massas verificadas, 100% OK.</div>` : ''}
        </div>
      ` : ''}

      ${details.length > 0 ? `
      <div class="pagination">
        <button type="button" class="page-btn" id="page-prev" onclick="prevPage()"><span aria-hidden="true">←</span> Anterior</button>
        <span class="page-info" id="page-info" aria-live="polite">${start + 1}–${end} de ${details.length}</span>
        <button type="button" class="page-btn" id="page-next" onclick="nextPage()">Próximo <span aria-hidden="true">→</span></button>
      </div>
      ` : ''}

      ${data.tip ? `
      <div class="tip-box">
        <span class="tip-icon" aria-hidden="true">💡</span>
        <div>${data.tip}</div>
      </div>
      ` : ''}
    </section>
  `;

  const tbody = document.getElementById('detail-tbody');
  if (tbody) {
    tbody.innerHTML = pageDetails.map(d => {
      return `<tr class="inconsistent-row">
        <td><strong>${d.name || '—'}</strong><br><span style="font-size:11px;color:var(--text2)">${shortCpf(d.cpf)}</span></td>
        <td><span class="badge badge-info">${d.statusCsv || '—'}</span></td>
        <td>${fmtBRL(d.csvFechada)}</td>
        <td>${fmtBRL(d.realFechada)}</td>
        <td><span class="badge ${Math.abs(d.diffFechada) <= 0.02 ? 'badge-ok' : 'badge-err'}" style="font-size:11px">${d.diffFechada > 0 ? '+' : ''}${fmtBRL(d.diffFechada)}</span></td>
        <td>${fmtBRL(d.csvAberta)}</td>
        <td>${fmtBRL(d.realAberta)}</td>
        <td><span class="badge ${Math.abs(d.diffAberta) <= 0.02 ? 'badge-ok' : 'badge-err'}" style="font-size:11px">${d.diffAberta > 0 ? '+' : ''}${fmtBRL(d.diffAberta)}</span></td>
      </tr>`;
    }).join('');
  }
}

function prevPage() { if (currentPage > 0) { currentPage--; render(data); } }
function nextPage() { if (currentPage < Math.ceil((data.details||[]).length / PER_PAGE) - 1) { currentPage++; render(data); } }

function showError(msg) {
  const box = document.getElementById('error-box');
  if (!box) return;
  box.className = 'error-box';
  box.textContent = msg;
  box.hidden = false;
}

function clearError() {
  const box = document.getElementById('error-box');
  if (box) { box.hidden = true; box.textContent = ''; }
}

/**
 * Token de admin. NUNCA embutir credencial neste arquivo — ele é versionado.
 * O operador faz login no painel admin (mesma origem) e o token fica no
 * localStorage; este dashboard só o reaproveita.
 */
function getAdminToken() {
  for (const k of ['token', 'authToken', 'admin_token']) {
    const v = window.localStorage.getItem(k);
    if (v) return v;
  }
  return null;
}

async function fetchData() {
  const cpf = document.getElementById('cpf-input')?.value.replace(/\D/g, '') || '';
  clearError();

  const token = getAdminToken();
  if (!token) {
    showError('Sessão de admin não encontrada. Faça login no painel admin nesta mesma origem e recarregue esta página, ou use "Carregar Dados de Exemplo".');
    return;
  }

  document.getElementById('loading-overlay')?.classList.add('active');
  const loadingText = document.getElementById('loading-text');
  if (loadingText) loadingText.textContent = 'Consultando CSV × Backend…';

  try {
    const params = new URLSearchParams();
    if (cpf) params.set('cpf', cpf);
    params.set('limit', '200');

    const res = await fetch(API_BASE + '/admin/audit-csv-consistency?' + params.toString(), {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.message || 'Erro na consulta');

    data = json;
    currentPage = 0;
    render(data);
    document.getElementById('last-update').textContent = '🔄 Atualizado: ' + new Date().toLocaleString('pt-BR');
  } catch (err) {
    loadSample();
    showError('Não foi possível consultar a API: ' + err.message + ' — verifique se o backend está no ar em ' + API_BASE + ' e se sua sessão de admin continua válida. Exibindo dados de exemplo enquanto isso.');
  } finally {
    document.getElementById('loading-overlay')?.classList.remove('active');
  }
}

function loadSample() {
  data = SAMPLE;
  currentPage = 0;
  render(data);
  document.getElementById('last-update').textContent = '📦 Dados de exemplo';
}

render(data);
</script>
</body>
</html>
