<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Consistência de Dias em Atraso</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0b12;
    --surface: #161622;
    --surface2: #1e1e32;
    --surface3: #282844;
    --border: #2a2a44;
    --text: #e8e8f0;
    --text2: #9090b8;
    --text3: #606088;
    --green: #00e676;
    --green-bg: rgba(0,230,118,0.10);
    --red: #ff5252;
    --red-bg: rgba(255,82,82,0.10);
    --amber: #ffd740;
    --amber-bg: rgba(255,215,64,0.10);
    --blue: #448aff;
    --blue-bg: rgba(68,138,255,0.10);
    --purple: #b388ff;
    --purple-bg: rgba(179,136,255,0.10);
    --cyan: #18ffff;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; }

  /* ── Header ── */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 24px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 20px;
  }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
  .header h1 span { background: linear-gradient(135deg, var(--green), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header .sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .header .status-badge {
    padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .header .status-badge.all-ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
  .header .status-badge.has-issues { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,82,82,0.2); }
  .header .status-badge.loading { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,215,64,0.25); }

  /* ── KPI Grid ── */
  .kpi-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    gap: 12px; margin-bottom: 20px;
  }
  .kpi-card {
    padding: 16px 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius);
    display: flex; flex-direction: column; gap: 4px;
    position: relative; overflow: hidden;
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .kpi-card.green::before { background: var(--green); }
  .kpi-card.red::before { background: var(--red); }
  .kpi-card.blue::before { background: var(--blue); }
  .kpi-card.amber::before { background: var(--amber); }
  .kpi-card .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text2); }
  .kpi-card .value { font-size: 30px; font-weight: 800; letter-spacing: -0.8px; line-height: 1.1; }
  .kpi-card .sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .kpi-card .value.green { color: var(--green); }
  .kpi-card .value.red { color: var(--red); }
  .kpi-card .value.blue { color: var(--blue); }
  .kpi-card .value.amber { color: var(--amber); }

  /* ── Charts Section ── */
  .charts-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;
  }
  @media (max-width: 700px) { .charts-row { grid-template-columns: 1fr; } }

  .chart-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px;
  }
  .chart-card .title {
    font-size: 13px; font-weight: 700; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .chart-card .title .count { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; background: var(--surface2); color: var(--text2); }

  /* ── Donut Chart ── */
  .donut-wrap {
    display: flex; align-items: center; justify-content: center; gap: 24px;
  }
  .donut {
    position: relative; width: 160px; height: 160px; flex-shrink: 0;
  }
  .donut svg { transform: rotate(-90deg); }
  .donut-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center;
  }
  .donut-center .pct { font-size: 28px; font-weight: 800; }
  .donut-center .pct-label { font-size: 11px; color: var(--text2); margin-top: 2px; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .donut-legend .item { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .donut-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend .item .val { font-weight: 700; margin-left: auto; }

  /* ── Section ── */
  .section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 20px; margin-bottom: 20px;
  }
  .section-title {
    font-size: 15px; font-weight: 700; margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .count {
    font-size: 11px; font-weight: 600; padding: 2px 10px; border-radius: 10px;
    background: var(--surface2); color: var(--text2);
  }

  /* ── Filters ── */
  .filters {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 16px;
  }
  .filters input {
    padding: 8px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 13px; outline: none; width: 160px; transition: 0.15s;
  }
  .filters input:focus { border-color: var(--blue); }
  .filters input::placeholder { color: var(--text3); }
  .filters button {
    padding: 8px 18px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .filters .btn-primary { background: var(--blue); color: #fff; }
  .filters .btn-primary:hover { background: #3d7cff; box-shadow: 0 2px 12px rgba(68,138,255,0.3); }
  .filters .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .filters .btn-secondary:hover { background: var(--border); }

  /* ── Table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 10px 12px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.7px; color: var(--text2);
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover { background: rgba(255,255,255,0.02); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr.consistent-row td { border-left: 3px solid var(--green); }
  tbody tr.inconsistent-row td { border-left: 3px solid var(--red); }
  tbody tr.consistent-row { opacity: 0.6; }
  tbody tr.consistent-row:hover { opacity: 1; }

  /* Status badges */
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
  }
  .badge-ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(0,230,118,0.2); }
  .badge-warn { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(255,215,64,0.2); }
  .badge-err { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,82,82,0.2); }
  .badge-info { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(68,138,255,0.2); }

  /* Pagination */
  .pagination {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .page-btn {
    padding: 6px 16px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 12px; font-weight: 600;
    cursor: pointer; transition: 0.15s;
  }
  .page-btn:hover { background: var(--border); }
  .page-btn:disabled { opacity: 0.3; cursor: default; }
  .page-info { font-size: 12px; color: var(--text2); }

  /* Empty state */
  .empty-state {
    text-align: center; padding: 32px; color: var(--text3);
    font-size: 14px;
  }
  .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

  /* Loading overlay */
  .loading-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 100; align-items: center; justify-content: center;
  }
  .loading-overlay.active { display: flex; }
  .spinner {
    width: 40px; height: 40px; border: 3px solid var(--surface3);
    border-top-color: var(--blue); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tip box */
  .tip-box {
    padding: 12px 16px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; font-size: 12px; color: var(--text2); margin-top: 12px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .tip-box .tip-icon { font-size: 16px; flex-shrink: 0; }

  /* Tooltip */
  .tt { position: relative; cursor: help; border-bottom: 1px dotted var(--text3); }
  .tt:hover::after {
    content: attr(data-tip); position: absolute; bottom: 120%; left: 50%; transform: translateX(-50%);
    background: var(--surface2); color: var(--text); padding: 6px 10px; border-radius: 6px;
    font-size: 11px; white-space: nowrap; border: 1px solid var(--border); z-index: 10;
  }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 10px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .kpi-card { padding: 12px 14px; }
    .kpi-card .value { font-size: 22px; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .donut-wrap { flex-direction: column; }
    .filters input { width: 100%; }
  }
</style>
</head>
<body>

<div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>

<div class="container" id="app"></div>

<script>
// ════════════════════════════════════════════════════════════════════════════
//  Dashboard de Consistência de Dias em Atraso
//  Auto-contido — sem dependências externas
// ════════════════════════════════════════════════════════════════════════════

const API_BASE = window.location.origin + '/api';
const SAMPLE = {
  "success": true,
  "summary": {
    "totalScanned": 52,
    "usersConsistent": 52,
    "usersDesatualizados": 0,
    "invoicesConsistent": 52,
    "invoicesDesatualizadas": 0,
    "totalInvoices": 52
  },
  "details": [],
  "filters": { "cpf": null, "limit": 100 },
  "tip": "✅ 100% consistente — nenhuma ação necessária."
};

// ─── Helpers ──────────────────────────────────────────────────────────────
const fmt = (v) => v.toLocaleString('pt-BR');
const fmtDate = (s) => { if (!s) return '—'; const d=new Date(s); return d.toLocaleDateString('pt-BR'); };
const shortCpf = (c) => c ? c.substring(0,3)+'.'+c.substring(3,6)+'.'+c.substring(6,9)+'-'+c.substring(9) : '—';

// ─── State ────────────────────────────────────────────────────────────────
let data = SAMPLE;
let currentPage = 0;
const PER_PAGE = 8;

// ─── Detect file:// protocol ──────────────────────────────────────────────
if (window.location.protocol === 'file:') {
  console.warn('[audit-consistency-dashboard] Aberto como file:// — fetch API não funcionará.');
  console.warn('Sirva este arquivo via servidor HTTP (ex: abra http://localhost:5173/scripts/audit_consistency_dashboard.html)');
}

// ─── Render Functions ─────────────────────────────────────────────────────

function renderDonut(pct, label, color) {
  const r = 70;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  return `<div class="donut">
    <svg width="160" height="160" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="14"/>
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="${color}" stroke-width="14"
        stroke-dasharray="${circ}" stroke-dashoffset="${offset}"
        stroke-linecap="round" style="transition: stroke-dashoffset 1.2s ease"/>
    </svg>
    <div class="donut-center">
      <div class="pct" style="color:${color}">${pct.toFixed(1)}%</div>
      <div class="pct-label">${label}</div>
    </div>
  </div>`;
}

function render(data) {
  const s = data.summary;
  const details = data.details || [];
  const hasIssues = (s.usersDesatualizados || 0) > 0 || (s.invoicesDesatualizadas || 0) > 0;
  const userPct = s.totalScanned > 0 ? ((s.usersConsistent / s.totalScanned) * 100) : 100;
  const invPct = s.totalInvoices > 0 ? ((s.invoicesConsistent / s.totalInvoices) * 100) : 100;

  // Pagination
  const totalPages = Math.ceil(details.length / PER_PAGE);
  const start = currentPage * PER_PAGE;
  const end = Math.min(start + PER_PAGE, details.length);
  const pageDetails = details.slice(start, end);

  // Build HTML
  document.getElementById('app').innerHTML = `
    ${window.location.protocol === 'file:' ? `
    <div style="padding:12px 16px;background:var(--amber-bg);border:1px solid rgba(255,215,64,0.2);border-radius:var(--radius);margin-bottom:16px;font-size:13px;color:var(--amber);display:flex;align-items:center;gap:10px">
      <span>⚠️</span>
      <div><strong>Modo arquivo local detectado</strong> — A consulta à API não funcionará diretamente.
      <br>Sirva este arquivo via servidor HTTP ou use o botão <strong>"📦 Dados de Exemplo"</strong> abaixo.</div>
    </div>
    ` : ''}

    <!-- Header -->
    <div class="header">
      <div>
        <h1>📊 <span>Consistência</span> de Dias em Atraso</h1>
        <div class="sub">Auditoria de sincronização entre <code>users.days_overdue</code> e <code>invoices.dias_atraso</code></div>
      </div>
      <div class="status-badge ${hasIssues ? 'has-issues' : 'all-ok'}">
        ${hasIssues ? '⚠️ ' + (s.usersDesatualizados + s.invoicesDesatualizadas) + ' anomalia(s)' : '✅ Dados íntegros'}
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="kpi-grid">
      <div class="kpi-card green">
        <div class="label">Usuários Escaneados</div>
        <div class="value green">${fmt(s.totalScanned)}</div>
        <div class="sub">CPFs únicos com fatura vencida</div>
      </div>
      <div class="kpi-card green">
        <div class="label">Usuários Consistentes</div>
        <div class="value green">${fmt(s.usersConsistent)}</div>
        <div class="sub"><span class="tt" data-tip="Diferença ≤ 1 dia entre users.days_overdue e real-time">days_overdue OK</span></div>
      </div>
      <div class="kpi-card ${(s.usersDesatualizados || 0) > 0 ? 'red' : 'green'}">
        <div class="label">Usuários Desatualizados</div>
        <div class="value ${(s.usersDesatualizados || 0) > 0 ? 'red' : 'green'}">${fmt(s.usersDesatualizados)}</div>
        <div class="sub">diferença > 1 dia</div>
      </div>
      <div class="kpi-card blue">
        <div class="label">Invoices Consistentes</div>
        <div class="value blue">${fmt(s.invoicesConsistent)}<span style="font-size:16px;color:var(--text3)">/${fmt(s.totalInvoices)}</span></div>
        <div class="sub"><span class="tt" data-tip="dias_atraso exato (diferença = 0)">dias_atraso OK</span></div>
      </div>
      <div class="kpi-card ${(s.invoicesDesatualizadas || 0) > 0 ? 'red' : 'green'}">
        <div class="label">Invoices Desatualizadas</div>
        <div class="value ${(s.invoicesDesatualizadas || 0) > 0 ? 'red' : 'green'}">${fmt(s.invoicesDesatualizadas)}</div>
        <div class="sub">dias_atraso incorreto</div>
      </div>
      <div class="kpi-card amber">
        <div class="label">Detalhes Inconsistentes</div>
        <div class="value amber">${details.length}</div>
        <div class="sub">${details.length > 0 ? '⚠️ Requer atenção' : '✅ Nenhum'}</div>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="charts-row">
      <div class="chart-card">
        <div class="title">🎯 Consistência de Usuários <span class="count">${s.totalScanned} CPFs</span></div>
        <div class="donut-wrap">
          ${renderDonut(userPct, 'consistentes', 'var(--green)')}
          <div class="donut-legend">
            <div class="item"><div class="dot" style="background:var(--green)"></div> Consistentes <span class="val" style="color:var(--green)">${fmt(s.usersConsistent)}</span></div>
            <div class="item"><div class="dot" style="background:var(--red)"></div> Desatualizados <span class="val" style="color:${(s.usersDesatualizados||0) > 0 ? 'var(--red)' : 'var(--text2)'}">${fmt(s.usersDesatualizados)}</span></div>
          </div>
        </div>
      </div>
      <div class="chart-card">
        <div class="title">📋 Consistência de Invoices <span class="count">${s.totalInvoices} faturas</span></div>
        <div class="donut-wrap">
          ${renderDonut(invPct, 'consistentes', 'var(--blue)')}
          <div class="donut-legend">
            <div class="item"><div class="dot" style="background:var(--blue)"></div> Consistentes <span class="val" style="color:var(--blue)">${fmt(s.invoicesConsistent)}</span></div>
            <div class="item"><div class="dot" style="background:var(--red)"></div> Desatualizadas <span class="val" style="color:${(s.invoicesDesatualizadas||0) > 0 ? 'var(--red)' : 'var(--text2)'}">${fmt(s.invoicesDesatualizadas)}</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Details Section -->
    <div class="section">
      <div class="section-title">
        🔍 Detalhes por Usuário
        <span class="count">${details.length} inconsistente(s)</span>
      </div>

      <!-- Filters -->
      <div class="filters">
        <input type="text" id="cpf-input" placeholder="CPF (11 dígitos)" maxlength="11" oninput="this.value=this.value.replace(/\\D/g,'')" />
        <button class="btn-primary" onclick="fetchData()">🔍 Consultar</button>
        <button class="btn-secondary" onclick="loadSample()">📦 Dados de Exemplo</button>
        <span style="font-size:11px;color:var(--text3);margin-left:auto;" id="last-update">Última: ${new Date().toLocaleString('pt-BR')}</span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th style="width:18%">Usuário</th>
              <th style="width:12%">Status</th>
              <th style="width:12%">Vencimento</th>
              <th style="width:14%">User DO</th>
              <th style="width:14%">Real-Time</th>
              <th style="width:14%">Invoice DA</th>
              <th style="width:8%">Diff U</th>
              <th style="width:8%">Diff I</th>
            </tr>
          </thead>
          <tbody id="detail-tbody"></tbody>
        </table>
      </div>

      ${details.length === 0 ? `
        <div class="empty-state">
          <div class="icon">✅</div>
          <div>Todos os dados estão consistentes — nenhuma discrepância encontrada.</div>
          ${s.totalScanned > 0 ? `<div style="margin-top:8px;font-size:12px;color:var(--text2)">${fmt(s.totalScanned)} usuários e ${fmt(s.totalInvoices)} invoices verificados, 100% OK.</div>` : ''}
        </div>
      ` : ''}

      ${details.length > 0 ? `
      <div class="pagination">
        <button class="page-btn" id="page-prev" onclick="prevPage()">← Anterior</button>
        <span class="page-info" id="page-info">${start + 1}–${end} de ${details.length}</span>
        <button class="page-btn" id="page-next" onclick="nextPage()">Próximo →</button>
      </div>
      ` : ''}

      ${data.tip ? `
      <div class="tip-box">
        <span class="tip-icon">💡</span>
        <div>${data.tip}</div>
      </div>
      ` : ''}
    </div>
  `;

  // Fill table
  const tbody = document.getElementById('detail-tbody');
  if (tbody) {
    tbody.innerHTML = pageDetails.map(d => {
      const userOk = Math.abs(d.diffUser) <= 1;
      const invOk = Math.abs(d.diffInvoice) <= 0;
      const rowOk = userOk && invOk;

      return `<tr class="${rowOk ? 'consistent-row' : 'inconsistent-row'}">
        <td><strong>${d.name}</strong><br><span style="font-size:11px;color:var(--text2)">${shortCpf(d.cpf)}</span></td>
        <td><span class="badge ${d.status === 'inadimplente' ? 'badge-err' : 'badge-info'}">${d.status || '—'}</span></td>
        <td>${fmtDate(d.dueDate)}</td>
        <td>${d.userDaysOverdue}</td>
        <td><span style="font-weight:700">${d.realTimeDays}</span></td>
        <td>${d.invoiceDiasAtraso}</td>
        <td><span class="badge ${Math.abs(d.diffUser) <= 1 ? 'badge-ok' : 'badge-warn'}" style="font-size:11px">${d.diffUser > 0 ? '+' : ''}${d.diffUser}</span></td>
        <td><span class="badge ${Math.abs(d.diffInvoice) <= 0 ? 'badge-ok' : 'badge-warn'}" style="font-size:11px">${d.diffInvoice > 0 ? '+' : ''}${d.diffInvoice}</span></td>
      </tr>`;
    }).join('');
  }
}

// ─── Navigation ───────────────────────────────────────────────────────────
function prevPage() { if (currentPage > 0) { currentPage--; render(data); } }
function nextPage() { if (currentPage < Math.ceil((data.details||[]).length / PER_PAGE) - 1) { currentPage++; render(data); } }

// ─── Data Fetching ────────────────────────────────────────────────────────
async function fetchData() {
  const cpf = document.getElementById('cpf-input')?.value.replace(/\D/g, '') || '';
  document.getElementById('loading-overlay')?.classList.add('active');

  try {
    // First get auth token
    const loginRes = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cpf: '99999999999', password: 'admin999' })
    });
    const loginData = await loginRes.json();
    if (!loginData.success || !loginData.token) {
      throw new Error('Falha ao autenticar como admin');
    }
    const token = loginData.token;

    // Build query
    const params = new URLSearchParams();
    if (cpf) params.set('cpf', cpf);
    params.set('limit', '200');

    const res = await fetch(API_BASE + '/admin/audit-consistency?' + params.toString(), {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const json = await res.json();
    if (!json.success) throw new Error(json.message || 'Erro na consulta');

    data = json;
    currentPage = 0;
    render(data);
    document.getElementById('last-update').textContent = '🔄 Atualizado: ' + new Date().toLocaleString('pt-BR');
  } catch (err) {
    alert('Erro ao consultar API: ' + err.message + '\n\nCarregando dados de exemplo...');
    loadSample();
  } finally {
    document.getElementById('loading-overlay')?.classList.remove('active');
  }
}

function loadSample() {
  data = SAMPLE;
  currentPage = 0;
  render(data);
  document.getElementById('last-update').textContent = '📦 Dados de exemplo';
}

// ─── Initial Render ───────────────────────────────────────────────────────
render(data);
</script>
