openapi: 3.0.0
info:
  title: Fintech Bank API
  description: API para aplicação bancária fintech com gestão de usuários, transações PIX e saldos
  version: 1.0.0
  contact:
    email: admin@fintechbank.local

servers:
  - url: http://localhost:3001
    description: Servidor de Desenvolvimento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome_completo:
          type: string
          minLength: 2
          maxLength: 100
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos
        email:
          type: string
          format: email
        saldo:
          type: number
          format: decimal
          minimum: 0
        data_criacao:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - cpf
        - senha
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos
        senha:
          type: string
          minLength: 6

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            nomeCompleto:
              type: string
            cpf:
              type: string
            email:
              type: string
            saldo:
              type: number
        token:
          type: string

    SignupRequest:
      type: object
      required:
        - nomeCompleto
        - cpf
        - email
        - senha
      properties:
        nomeCompleto:
          type: string
          minLength: 2
          maxLength: 100
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos
        email:
          type: string
          format: email
        senha:
          type: string
          minLength: 6

    PixTransactionRequest:
      type: object
      required:
        - chavePix
        - valor
      properties:
        chavePix:
          type: string
          description: Chave PIX (CPF, email, telefone ou chave aleatória)
        valor:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 10000

    PixTransactionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        transacao:
          type: object
          properties:
            id:
              type: string
            valor:
              type: number
            destinatario:
              type: string
            data:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

paths:
  /api/login:
    post:
      summary: Autenticar usuário
      description: Realiza login com CPF e senha
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              cpf: "00000000000"
              senha: "admin123"
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/signup:
    post:
      summary: Cadastrar novo usuário
      description: Cria uma nova conta de usuário
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              nomeCompleto: "João Silva"
              cpf: "12345678901"
              email: "joao@email.com"
              senha: "minhasenha123"
      responses:
        '201':
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Usuário criado com sucesso"
        '400':
          description: Dados inválidos ou usuário já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pix:
    post:
      summary: Realizar transação PIX
      description: Envia dinheiro via PIX para outro usuário
      tags:
        - Transações
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PixTransactionRequest'
            example:
              chavePix: "12345678901"
              valor: 100.50
      responses:
        '200':
          description: Transação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixTransactionResponse'
        '400':
          description: Dados inválidos ou saldo insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Destinatário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/saldo:
    get:
      summary: Consultar saldo
      description: Retorna o saldo atual do usuário autenticado
      tags:
        - Conta
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo consultado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  saldo:
                    type: number
                    example: 1500.75
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Autenticação
    description: Endpoints para login e cadastro
  - name: Transações
    description: Endpoints para transações PIX
  - name: Conta
    description: Endpoints para gestão da conta