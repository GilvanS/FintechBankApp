openapi: 3.0.0
info:
  title: Fintech Bank API
  description: API para aplicação bancária com funcionalidades PIX
  version: 1.0.0
  contact:
    name: Equipe de Desenvolvimento
    email: dev@fintechbank.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3001
    description: Servidor de desenvolvimento

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    User:
      type: object
      required:
        - id
        - nomeCompleto
        - cpf
        - email
        - saldo
      properties:
        id:
          type: string
          description: ID único do usuário
        nomeCompleto:
          type: string
          description: Nome completo do usuário
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos
        email:
          type: string
          format: email
        saldo:
          type: number
          format: decimal
          minimum: 0
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, blocked, suspended]
        limits:
          type: object
          properties:
            daily:
              type: number
              format: decimal
            monthly:
              type: number
              format: decimal
        dataCriacao:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - cpf
        - senha
      properties:
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos
          example: "12345678901"
        senha:
          type: string
          minLength: 6
          example: "MinhaSenh@123"

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
            nomeCompleto:
              type: string
            cpf:
              type: string
            email:
              type: string
            saldo:
              type: number
        token:
          type: string

    SignupRequest:
      type: object
      required:
        - nomeCompleto
        - cpf
        - email
        - senha
      properties:
        nomeCompleto:
          type: string
          minLength: 2
          maxLength: 100
          description: Nome completo do usuário
          example: "João da Silva"
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com 11 dígitos (apenas números)
          example: "12345678901"
        email:
          type: string
          format: email
          description: Email válido do usuário
          example: "joao.silva@example.com"
        senha:
          type: string
          minLength: 6
          description: Senha com pelo menos 6 caracteres, contendo ao menos 1 letra minúscula, 1 maiúscula e 1 número
          example: "MinhaSenh@123"

    PixTransactionRequest:
      type: object
      required:
        - cpfOrigem
        - cpfDestino
        - valor
      properties:
        cpfOrigem:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF do remetente
          example: "12345678901"
        cpfDestino:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF do destinatário
          example: "98765432100"
        valor:
          type: number
          format: decimal
          minimum: 0.01
          maximum: 10000
          example: 100.50

    PixTransactionResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        transacao:
          type: object
          properties:
            id:
              type: string
            valor:
              type: number
            destinatario:
              type: string
            data:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

paths:
  /api/login:
    post:
      summary: Autenticar usuário
      description: Realiza login com CPF e senha
      tags:
        - Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              cpf: "12345678901"
              senha: "MinhaSenh@123"
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                message: "Login realizado com sucesso"
                user:
                  id: "f8035fa3-864c-59df-540e-c5ccd4566501"
                  nomeCompleto: "João da Silva"
                  cpf: "12345678901"
                  email: "joao.silva@example.com"
                  saldo: 1500.75
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/signup:
    post:
      tags:
        - Autenticação
      summary: Cadastrar novo usuário
      description: |
        Cadastra um novo usuário no sistema. Os campos id, saldo e limits são gerados automaticamente:
        - id: UUID gerado automaticamente
        - saldo: Iniciado com R$ 0,00
        - pix_daily_limit: R$ 1.000,00 (padrão)
        - pix_monthly_limit: R$ 20.000,00 (padrão)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              nomeCompleto: "João da Silva"
              cpf: "12345678901"
              email: "joao.silva@example.com"
              senha: "MinhaSenh@123"
      responses:
        '201':
          description: Usuário cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                success: true
                message: "Usuário cadastrado com sucesso"
                user:
                  id: "f8035fa3-864c-59df-540e-c5ccd4566501"
                  nomeCompleto: "João da Silva"
                  cpf: "12345678901"
                  email: "joao.silva@example.com"
                  saldo: 0.00
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        '409':
          description: CPF ou email já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "CPF já cadastrado no sistema"
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/pix:
    post:
      summary: Realizar transação PIX
      description: Envia dinheiro via PIX para outro usuário
      tags:
        - Transações
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PixTransactionRequest'
            example:
              cpfOrigem: "12345678901"
              cpfDestino: "98765432100"
              valor: 100.50
      responses:
        '200':
          description: Transação realizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PixTransactionResponse'
              example:
                success: true
                message: "Transação PIX realizada com sucesso"
                transacao:
                  id: "tx_123456789"
                  valor: 100.50
                  destinatario: "98765432100"
                  data: "2024-03-20T10:30:00Z"
        '400':
          description: Dados inválidos ou saldo insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Destinatário não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/saldo:
    get:
      summary: Consultar saldo
      description: Retorna o saldo atual do usuário autenticado
      tags:
        - Conta
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Saldo consultado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  saldo:
                    type: number
                    example: 1500.75
        '401':
          description: Token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

tags:
  - name: Autenticação
    description: Endpoints para login e cadastro
  - name: Transações
    description: Endpoints para transações PIX
  - name: Conta
    description: Endpoints para gestão da conta